<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Trading Floor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #050008; color: #e0e0ff; font-family: 'Courier New', monospace; overflow-x: hidden; }
.header { background: #080010; border-bottom: 1px solid #3A0060; padding: 8px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { color: #FF2D78; font-size: 14px; font-weight: bold; letter-spacing: 3px; }
.stats { display: flex; gap: 20px; }
.stat .lbl { font-size: 8px; color: #440066; text-transform: uppercase; letter-spacing: 1px; }
.stat .val { font-size: 13px; font-weight: bold; color: #AA44FF; }
.stat .val.pos { color: #00FFCC; }
.stat .val.neg { color: #FF2D78; }
.refresh-btn { background: #1A0030; border: 1px solid #6600BB; color: #AA44FF; padding: 5px 14px; font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer; border-radius: 3px; }
.refresh-btn:hover { background: #2A0050; }
canvas { display: block; cursor: grab; }
canvas:active { cursor: grabbing; }
#hint { font-size: 8px; color: #220033; letter-spacing: 2px; text-align: center; padding: 3px 0 6px; text-transform: uppercase; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(5,0,8,0.88); z-index: 999; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.mbox { background: #08000F; border-radius: 6px; padding: 22px; width: min(440px, 94vw); max-height: 90vh; overflow-y: auto; position: relative; }
.mclose { position: absolute; top: 10px; right: 14px; background: none; border: none; color: #FF4488; font-size: 18px; cursor: pointer; }
.m-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
.m-role { font-size: 9px; color: #660088; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.m-badge { display: inline-block; font-size: 9px; font-weight: bold; padding: 2px 8px; border-radius: 2px; margin-bottom: 14px; text-transform: uppercase; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.info-cell { background: #0A0014; border: 1px solid #2A0040; padding: 8px 10px; border-radius: 3px; }
.info-cell .lbl { font-size: 8px; color: #440066; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
.info-cell .val { font-size: 12px; font-weight: bold; color: #DDD; }
.terminal { background: #02000A; border: 1px solid #1A0028; padding: 10px; font-size: 9px; max-height: 120px; overflow-y: auto; line-height: 1.7; color: #6622AA; }
.terminal .t0 { color: #AA44FF; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">◈ NEURAL TRADING FLOOR</div>
  <div class="stats">
    <div class="stat">
      <div class="lbl">Balance</div>
      <div class="val" id="hbal">{{ balance | default(1000) }}€</div>
    </div>
    <div class="stat">
      <div class="lbl">P&amp;L</div>
      <div class="val" id="hpnl">{{ pnl | default(0) }}€</div>
    </div>
    <div class="stat">
      <div class="lbl">BTC</div>
      <div class="val" id="hbtc">—</div>
    </div>
    <div class="stat">
      <div class="lbl">Agents</div>
      <div class="val" id="hagents">6</div>
    </div>
  </div>
  <button onclick="fetchBTC();fetchAgents();" class="refresh-btn">↻ Live</button>
</div>

<canvas id="c"></canvas>
<div id="hint">scroll to zoom · drag to pan · click agent monitor for details</div>

<div class="overlay" id="modal" onclick="closeModal(event)">
  <div class="mbox" id="mbox">
    <button class="mclose" onclick="closeModalDirect()">✕</button>
    <div class="m-title" id="m-title"></div>
    <div class="m-role" id="m-role"></div>
    <div class="m-badge" id="m-badge"></div>
    <div class="info-grid" id="m-grid"></div>
    <div class="terminal" id="m-terminal"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────
// CONSTANTS & CANVAS SETUP
// ─────────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 1000, H = 590;
var TW = 60, TH = 30, WH = 35;
var OX = 480, OY = 100;

canvas.width = W;
canvas.height = H;
canvas.style.width = '100%';
canvas.style.maxWidth = W + 'px';
canvas.style.margin = '0 auto';
canvas.style.display = 'block';

// ─────────────────────────────────────────────────────────────────
// ISOMETRIC PROJECTION
// ─────────────────────────────────────────────────────────────────
function iso(gx, gy, gz) {
  gz = gz || 0;
  return {
    x: OX + (gx - gy) * TW / 2,
    y: OY + (gx + gy) * TH / 2 - gz * WH
  };
}

// ─────────────────────────────────────────────────────────────────
// ZOOM & PAN
// ─────────────────────────────────────────────────────────────────
var scale = 1.0;
var panX = 0, panY = 0;
var isDragging = false;
var lastMouse = null;
var mouseMovedDuringDrag = false;

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  var factor = e.deltaY < 0 ? 1.1 : 0.9;
  scale = Math.max(0.5, Math.min(2.0, scale * factor));
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  isDragging = true;
  mouseMovedDuringDrag = false;
  lastMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  var dx = e.clientX - lastMouse.x;
  var dy = e.clientY - lastMouse.y;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) mouseMovedDuringDrag = true;
  panX += dx;
  panY += dy;
  lastMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mouseup', function(e) {
  isDragging = false;
});
canvas.addEventListener('mouseleave', function() { isDragging = false; });

function toCanvasCoords(e) {
  var r = canvas.getBoundingClientRect();
  var scaleX = canvas.width / r.width;
  return {
    x: ((e.clientX - r.left) * scaleX - panX) / scale,
    y: ((e.clientY - r.top) * scaleX - panY) / scale
  };
}

// ─────────────────────────────────────────────────────────────────
// BINANCE API
// ─────────────────────────────────────────────────────────────────
var BINANCE = 'https://api.binance.com/api/v3';
var btcKlines = [];
var btcTicker = {};
var currentInterval = '15m';
var btcApiOk = false;

async function fetchBTC() {
  try {
    var kRes = await fetch(BINANCE + '/klines?symbol=BTCUSDT&interval=' + currentInterval + '&limit=80');
    var tRes = await fetch(BINANCE + '/ticker/24hr?symbol=BTCUSDT');
    if (!kRes.ok || !tRes.ok) throw new Error('API error');
    var kData = await kRes.json();
    btcTicker = await tRes.json();
    btcKlines = kData.map(function(k) {
      return {
        t: k[0] / 1000,
        o: parseFloat(k[1]),
        h: parseFloat(k[2]),
        l: parseFloat(k[3]),
        c: parseFloat(k[4]),
        v: parseFloat(k[5])
      };
    });
    btcApiOk = true;
    var price = parseFloat(btcTicker.lastPrice);
    if (!isNaN(price)) {
      document.getElementById('hbtc').textContent = '$' + price.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }
  } catch(e) {
    btcApiOk = false;
    console.warn('[BTC] API unavailable:', e.message);
  }
}

fetchBTC();
setInterval(fetchBTC, 10000);

// ─────────────────────────────────────────────────────────────────
// TIMEFRAME BUTTONS ZONES
// ─────────────────────────────────────────────────────────────────
var TF_OPTIONS = ['1m','5m','15m','1h','4h','1d'];
var tfZones = [];

// ─────────────────────────────────────────────────────────────────
// AGENTS DATA
// ─────────────────────────────────────────────────────────────────
var AGENTS = [
  { id:'scanner',   name:'Scanner',   role:'Market Watch',    color:'#00FFCC', pants:'#0A1525', skin:'#F4C794', gx:2,  gy:2 },
  { id:'analyste',  name:'Analyste',  role:'Signal Analysis', color:'#00AAFF', pants:'#0A0A25', skin:'#D4956A', gx:5,  gy:2 },
  { id:'trader',    name:'★ Trader',  role:'Order Execution', color:'#FFD700', pants:'#1A1A05', skin:'#F4C794', gx:11, gy:2 },
  { id:'risk',      name:'Risk Mgr',  role:'Risk Control',    color:'#FF4488', pants:'#1A0A10', skin:'#D4956A', gx:2,  gy:6 },
  { id:'portfolio', name:'Portfolio', role:'Asset Manager',   color:'#44FF88', pants:'#0A1A08', skin:'#F4C794', gx:5,  gy:6 },
  { id:'reporter',  name:'Reporter',  role:'Telegram Alerts', color:'#CC88FF', pants:'#10082A', skin:'#D4956A', gx:11, gy:6 }
];

// Agent state machine
var agentStates = {};
var agentWalkPhase = {};
var agentBreakTimer = {};

AGENTS.forEach(function(a, i) {
  agentStates[a.id] = { state: 'working', wx: a.gx + 0.9, wy: a.gy + 0.8, tx: a.gx + 0.9, ty: a.gy + 0.8 };
  agentWalkPhase[a.id] = 0;
  agentBreakTimer[a.id] = 400 + i * 200;
});

var WALK_SPEED = 0.025;
var BREAK_SPOTS = [
  { x: 14.2, y: 9.5 },
  { x: 1.3,  y: 9.5 }
];

function updateAgents() {
  AGENTS.forEach(function(a, i) {
    var st = agentStates[a.id];
    agentBreakTimer[a.id]--;

    if (st.state === 'working') {
      agentWalkPhase[a.id] = 0;
      if (agentBreakTimer[a.id] <= 0) {
        st.state = 'to_break';
        var spot = BREAK_SPOTS[i % BREAK_SPOTS.length];
        st.tx = spot.x;
        st.ty = spot.y;
        agentBreakTimer[a.id] = 350 + i * 80;
      }
    } else if (st.state === 'to_break') {
      var dx = st.tx - st.wx;
      var dy = st.ty - st.wy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < WALK_SPEED) {
        st.wx = st.tx;
        st.wy = st.ty;
        st.state = 'at_break';
        agentBreakTimer[a.id] = 200 + i * 40;
      } else {
        st.wx += (dx / dist) * WALK_SPEED;
        st.wy += (dy / dist) * WALK_SPEED;
        agentWalkPhase[a.id] += 0.15;
      }
    } else if (st.state === 'at_break') {
      if (agentBreakTimer[a.id] <= 0) {
        st.state = 'returning';
        st.tx = a.gx + 0.9;
        st.ty = a.gy + 0.8;
      }
    } else if (st.state === 'returning') {
      var dx = st.tx - st.wx;
      var dy = st.ty - st.wy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < WALK_SPEED) {
        st.wx = st.tx;
        st.wy = st.ty;
        st.state = 'working';
        agentBreakTimer[a.id] = 500 + i * 150;
      } else {
        st.wx += (dx / dist) * WALK_SPEED;
        st.wy += (dy / dist) * WALK_SPEED;
        agentWalkPhase[a.id] += 0.15;
      }
    }
  });
}

// ─────────────────────────────────────────────────────────────────
// FLASK API DATA
// ─────────────────────────────────────────────────────────────────
var apiData = {};

async function fetchAgents() {
  try {
    var r = await fetch('/api/agents');
    if (!r.ok) throw new Error('no api');
    apiData = await r.json();
    var s = apiData._stats || {};
    if (s.balance !== undefined) {
      document.getElementById('hbal').textContent = s.balance.toFixed(2) + '€';
    }
    if (s.pnl !== undefined) {
      var el = document.getElementById('hpnl');
      el.textContent = (s.pnl >= 0 ? '+' : '') + s.pnl.toFixed(2) + '€';
      el.className = 'val ' + (s.pnl >= 0 ? 'pos' : 'neg');
    }
  } catch(e) {}
}
fetchAgents();
setInterval(fetchAgents, 60000);

// ─────────────────────────────────────────────────────────────────
// STEAM PARTICLES (coffee station)
// ─────────────────────────────────────────────────────────────────
var steamParticles = [];
function updateSteam() {
  var coffeePos = iso(14.2, 9.0, 1.1);
  if (Math.random() < 0.18) {
    steamParticles.push({
      x: coffeePos.x + (Math.random() - 0.5) * 8,
      y: coffeePos.y,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -0.6 - Math.random() * 0.4,
      life: 1.0,
      size: 1.5 + Math.random() * 2
    });
  }
  steamParticles = steamParticles.filter(function(p) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.016;
    return p.life > 0;
  });
  if (steamParticles.length > 50) steamParticles.splice(0, 10);
}

// ─────────────────────────────────────────────────────────────────
// SERVER LED BLINK STATE
// ─────────────────────────────────────────────────────────────────
var ledColors = ['#00FF44','#FF4400','#0088FF','#FFFF00','#FF00FF','#00FFFF'];
var ledStates = [1, 0, 1, 1, 0, 1];
setInterval(function() {
  var idx = Math.floor(Math.random() * ledStates.length);
  ledStates[idx] = ledStates[idx] ? 0 : 1;
}, 600);

// ─────────────────────────────────────────────────────────────────
// MONITOR CLICK ZONES
// ─────────────────────────────────────────────────────────────────
var monitorZones = [];

// ─────────────────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────────────────
function openModal(agent) {
  var el = document.getElementById('modal');
  var titleEl = document.getElementById('m-title');
  var roleEl = document.getElementById('m-role');
  var badgeEl = document.getElementById('m-badge');
  var gridEl = document.getElementById('m-grid');
  var termEl = document.getElementById('m-terminal');
  var mbox = document.getElementById('mbox');

  titleEl.textContent = agent.name;
  titleEl.style.color = agent.color;
  roleEl.textContent = agent.role;
  mbox.style.border = '1px solid ' + agent.color;
  mbox.style.boxShadow = '0 0 30px ' + agent.color + '44';

  var st = agentStates[agent.id];
  var stateLabel = st.state === 'working' ? 'ACTIF' : (st.state === 'at_break' ? 'PAUSE' : 'EN ROUTE');
  var stateColor = st.state === 'working' ? '#00FF88' : (st.state === 'at_break' ? '#FFAA00' : '#FF4488');
  badgeEl.textContent = stateLabel;
  badgeEl.style.background = stateColor + '22';
  badgeEl.style.color = stateColor;
  badgeEl.style.border = '1px solid ' + stateColor;

  var agentApi = apiData[agent.id] || {};
  var info = agentApi.info || [
    { label: 'Status', value: stateLabel },
    { label: 'Uptime', value: '—' },
    { label: 'Signals', value: '—' },
    { label: 'Trades', value: '—' },
    { label: 'Win Rate', value: '—' },
    { label: 'Last Action', value: '—' }
  ];

  gridEl.innerHTML = '';
  info.forEach(function(item) {
    gridEl.innerHTML += '<div class="info-cell"><div class="lbl">' + (item.label || '') + '</div><div class="val">' + (item.value || '—') + '</div></div>';
  });

  var logs = agentApi.logs || ['> Aucune donnée disponible'];
  termEl.innerHTML = logs.map(function(l, i) {
    return '<div class="' + (i === 0 ? 't0' : '') + '">' + l + '</div>';
  }).join('');
  termEl.scrollTop = termEl.scrollHeight;

  el.classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}
function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
}

// ─────────────────────────────────────────────────────────────────
// CANVAS CLICK
// ─────────────────────────────────────────────────────────────────
canvas.addEventListener('click', function(e) {
  if (mouseMovedDuringDrag) return;
  var c = toCanvasCoords(e);
  var cx = c.x;
  var cy = c.y;

  // Check timeframe buttons
  for (var i = 0; i < tfZones.length; i++) {
    var z = tfZones[i];
    if (cx >= z.x1 && cx <= z.x2 && cy >= z.y1 && cy <= z.y2) {
      currentInterval = z.interval;
      fetchBTC();
      return;
    }
  }

  // Check monitor zones
  for (var j = 0; j < monitorZones.length; j++) {
    var mz = monitorZones[j];
    if (cx >= mz.x1 && cx <= mz.x2 && cy >= mz.y1 && cy <= mz.y2) {
      openModal(mz.agent);
      return;
    }
  }
});

// ─────────────────────────────────────────────────────────────────
// DRAW: ISOMETRIC FLOOR TILE
// ─────────────────────────────────────────────────────────────────
function drawTile(gx, gy) {
  var tl = iso(gx,     gy,     0);
  var tr = iso(gx + 1, gy,     0);
  var br = iso(gx + 1, gy + 1, 0);
  var bl = iso(gx,     gy + 1, 0);

  var fade = 1.0 - (gy / 12) * 0.15;
  ctx.globalAlpha = fade;

  var isEven = (gx + gy) % 2 === 0;
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y);
  ctx.lineTo(tr.x, tr.y);
  ctx.lineTo(br.x, br.y);
  ctx.lineTo(bl.x, bl.y);
  ctx.closePath();

  var grad = ctx.createLinearGradient(tl.x, tl.y, br.x, br.y);
  if (isEven) {
    grad.addColorStop(0, '#1C0033');
    grad.addColorStop(0.5, '#140025');
    grad.addColorStop(1, '#0F001C');
  } else {
    grad.addColorStop(0, '#230040');
    grad.addColorStop(0.5, '#1A002E');
    grad.addColorStop(1, '#140025');
  }
  ctx.fillStyle = grad;
  ctx.fill();

  // Top-left edge highlight
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y);
  ctx.lineTo(tr.x, tr.y);
  ctx.strokeStyle = '#2A0050';
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = fade * 0.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y);
  ctx.lineTo(bl.x, bl.y);
  ctx.stroke();

  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────────────────────
// DRAW: WALLS
// ─────────────────────────────────────────────────────────────────
function drawWalls() {
  // Back wall (gy=0, gx=0..16)
  for (var gx = 0; gx < 16; gx++) {
    var bl = iso(gx,     0, 0);
    var br = iso(gx + 1, 0, 0);
    var tr = iso(gx + 1, 0, 4);
    var tl = iso(gx,     0, 4);

    ctx.beginPath();
    ctx.moveTo(bl.x, bl.y);
    ctx.lineTo(br.x, br.y);
    ctx.lineTo(tr.x, tr.y);
    ctx.lineTo(tl.x, tl.y);
    ctx.closePath();

    var wallGrad = ctx.createLinearGradient(bl.x, bl.y, tl.x, tl.y);
    wallGrad.addColorStop(0, '#150030');
    wallGrad.addColorStop(0.5, '#1E003A');
    wallGrad.addColorStop(1, '#28004A');
    ctx.fillStyle = wallGrad;
    ctx.fill();

    for (var hz = 1; hz <= 3; hz++) {
      var la = iso(gx,     0, hz);
      var lb = iso(gx + 1, 0, hz);
      ctx.beginPath();
      ctx.moveTo(la.x, la.y);
      ctx.lineTo(lb.x, lb.y);
      ctx.strokeStyle = '#3A0060';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // Neon base strip
    var nb0 = iso(gx,     0, 0.05);
    var nb1 = iso(gx + 1, 0, 0.05);
    var nt0 = iso(gx,     0, 0.25);
    var nt1 = iso(gx + 1, 0, 0.25);
    ctx.beginPath();
    ctx.moveTo(nb0.x, nb0.y);
    ctx.lineTo(nb1.x, nb1.y);
    ctx.lineTo(nt1.x, nt1.y);
    ctx.lineTo(nt0.x, nt0.y);
    ctx.closePath();
    ctx.fillStyle = '#8800FF';
    ctx.shadowColor = '#8800FF';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Left wall (gx=0, gy=0..12)
  for (var gy = 0; gy < 12; gy++) {
    var bl = iso(0, gy,     0);
    var br = iso(0, gy + 1, 0);
    var tr = iso(0, gy + 1, 4);
    var tl = iso(0, gy,     4);

    ctx.beginPath();
    ctx.moveTo(bl.x, bl.y);
    ctx.lineTo(br.x, br.y);
    ctx.lineTo(tr.x, tr.y);
    ctx.lineTo(tl.x, tl.y);
    ctx.closePath();

    var lwGrad = ctx.createLinearGradient(bl.x, bl.y, br.x, br.y);
    lwGrad.addColorStop(0, '#12002A');
    lwGrad.addColorStop(1, '#1A0035');
    ctx.fillStyle = lwGrad;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.globalAlpha = 1;

    for (var hz = 1; hz <= 3; hz++) {
      var la = iso(0, gy,     hz);
      var lb = iso(0, gy + 1, hz);
      ctx.beginPath();
      ctx.moveTo(la.x, la.y);
      ctx.lineTo(lb.x, lb.y);
      ctx.strokeStyle = '#3A0060';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    var nb0 = iso(0, gy,     0.05);
    var nb1 = iso(0, gy + 1, 0.05);
    var nt0 = iso(0, gy,     0.25);
    var nt1 = iso(0, gy + 1, 0.25);
    ctx.beginPath();
    ctx.moveTo(nb0.x, nb0.y);
    ctx.lineTo(nb1.x, nb1.y);
    ctx.lineTo(nt1.x, nt1.y);
    ctx.lineTo(nt0.x, nt0.y);
    ctx.closePath();
    ctx.fillStyle = '#8800FF';
    ctx.shadowColor = '#8800FF';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ─────────────────────────────────────────────────────────────────
// DRAW: FLOOR
// ─────────────────────────────────────────────────────────────────
function drawFloor() {
  for (var gx = 1; gx <= 15; gx++) {
    for (var gy = 1; gy <= 11; gy++) {
      drawTile(gx, gy);
    }
  }
}

// ─────────────────────────────────────────────────────────────────
// SCREEN CORNERS
// ─────────────────────────────────────────────────────────────────
function computeScreenCorners() {
  return {
    bl: iso(3,  0, 0.4),
    br: iso(13, 0, 0.4),
    tl: iso(3,  0, 3.9),
    tr: iso(13, 0, 3.9)
  };
}

// ─────────────────────────────────────────────────────────────────
// DRAW: CHART CONTENT (in screen-local space)
// ─────────────────────────────────────────────────────────────────
var chartW = 600, chartH = 300;

function drawChartContent() {
  ctx.fillStyle = '#020008';
  ctx.fillRect(0, 0, chartW, chartH);

  var klines = btcKlines;
  var n = klines.length;
  if (n === 0) return;

  var lastK = klines[n - 1];
  var prevK = n > 1 ? klines[n - 2] : klines[0];
  var price = lastK.c;
  var prevPrice = prevK.c;
  var priceColor = price >= prevPrice ? '#00FFCC' : '#FF2D78';

  // ── Header ──
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 18px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('BTC/USDT', 10, 22);

  ctx.font = 'bold 15px Courier New';
  ctx.fillStyle = priceColor;
  ctx.textAlign = 'right';
  var priceStr = '$' + price.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  ctx.fillText(priceStr, chartW - 10, 22);

  if (btcTicker && btcTicker.priceChangePercent !== undefined) {
    var pct = parseFloat(btcTicker.priceChangePercent);
    ctx.font = '9px Courier New';
    ctx.fillStyle = pct >= 0 ? '#00FFCC' : '#FF2D78';
    ctx.textAlign = 'right';
    ctx.fillText((pct >= 0 ? '+' : '') + pct.toFixed(2) + '%  24h', chartW - 10, 34);

    var hi = parseFloat(btcTicker.highPrice).toFixed(0);
    var lo = parseFloat(btcTicker.lowPrice).toFixed(0);
    ctx.fillStyle = '#6644AA';
    ctx.font = '8px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('H: $' + hi + '   L: $' + lo, 10, 35);
  }

  // ── Timeframe buttons ──
  TF_OPTIONS.forEach(function(tf, i) {
    var bx = 10 + i * 55;
    var by = 38;
    var bw = 48;
    var bh = 16;
    var isActive = tf === currentInterval;

    ctx.fillStyle = isActive ? '#9B30FF' : '#1A0030';
    ctx.strokeStyle = isActive ? '#CC66FF' : '#3A0060';
    ctx.lineWidth = 0.8;

    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(bx, by, bw, bh, 3);
    } else {
      ctx.rect(bx, by, bw, bh);
    }
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isActive ? '#FFFFFF' : '#8844AA';
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(tf, bx + bw / 2, by + 11);
  });

  // ── Chart area ──
  var cTop = 65, cBot = 278;
  var cH = cBot - cTop;
  var cLeft = 10, cRight = chartW - 55;
  var cW = cRight - cLeft;

  // Price range
  var hMax = -Infinity, lMin = Infinity;
  klines.forEach(function(k) {
    if (k.h > hMax) hMax = k.h;
    if (k.l < lMin) lMin = k.l;
  });
  var priceRange = hMax - lMin;
  if (priceRange < 1) priceRange = 1;
  var pricePad = priceRange * 0.06;
  hMax += pricePad;
  lMin -= pricePad;
  priceRange = hMax - lMin;

  function pxY(p) {
    return cBot - ((p - lMin) / priceRange) * cH;
  }
  function pxX(i) {
    return cLeft + (i / Math.max(n - 1, 1)) * cW;
  }

  // ── Grid ──
  ctx.strokeStyle = '#2A0050';
  ctx.lineWidth = 0.5;
  var nGridH = 5;
  for (var gi = 0; gi <= nGridH; gi++) {
    var gp = lMin + (gi / nGridH) * priceRange;
    var gridY = pxY(gp);
    ctx.beginPath();
    ctx.moveTo(cLeft, gridY);
    ctx.lineTo(cRight, gridY);
    ctx.stroke();

    ctx.fillStyle = '#6644AA';
    ctx.font = '7px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('$' + gp.toFixed(0), cRight + 3, gridY + 3);
  }

  // Vertical time grid
  var vStep = Math.max(1, Math.floor(n / 8));
  for (var vi = 0; vi < n; vi += vStep) {
    var vx = pxX(vi);
    ctx.beginPath();
    ctx.moveTo(vx, cTop);
    ctx.lineTo(vx, cBot);
    ctx.strokeStyle = '#1A0035';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Bottom axis line
  ctx.beginPath();
  ctx.moveTo(cLeft, cBot);
  ctx.lineTo(cRight, cBot);
  ctx.strokeStyle = '#3A0060';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ── Candlesticks ──
  var candleW = Math.max(1.5, (cW / n) * 0.75);
  var halfC = candleW / 2;

  klines.forEach(function(k, i) {
    var x = pxX(i);
    var isBull = k.c >= k.o;
    var bodyColor = isBull ? '#00C878' : '#FF2D78';

    var yH = pxY(k.h);
    var yL = pxY(k.l);
    var yO = pxY(k.o);
    var yC = pxY(k.c);

    var bodyTop = Math.min(yO, yC);
    var bodyBot = Math.max(yO, yC);
    var bodyH = Math.max(1, bodyBot - bodyTop);

    // Wick
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = Math.max(0.5, candleW * 0.12);
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(x, yH);
    ctx.lineTo(x, yL);
    ctx.stroke();

    // Body
    ctx.fillStyle = bodyColor;
    ctx.globalAlpha = isBull ? 0.9 : 0.8;
    ctx.fillRect(x - halfC, bodyTop, candleW, bodyH);
    ctx.globalAlpha = 1;
  });

  // ── Edge vignette ──
  var vig = ctx.createLinearGradient(0, 0, chartW, 0);
  vig.addColorStop(0, '#9B30FF22');
  vig.addColorStop(0.1, 'transparent');
  vig.addColorStop(0.9, 'transparent');
  vig.addColorStop(1, '#9B30FF22');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, chartW, chartH);

  // ── Scanlines ──
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = '#000';
  for (var sy = 0; sy < chartH; sy += 3) {
    ctx.fillRect(0, sy, chartW, 1.5);
  }
  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────────────────────
// DRAW: LARGE BTC SCREEN
// ─────────────────────────────────────────────────────────────────
function drawScreen() {
  var SC = computeScreenCorners();

  // ── Bezel (slightly larger) ──
  var pad = 7;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(SC.bl.x - pad * 0.6, SC.bl.y + pad * 0.25);
  ctx.lineTo(SC.br.x + pad * 0.6, SC.br.y + pad * 0.25);
  ctx.lineTo(SC.tr.x + pad * 0.6, SC.tr.y - pad * 0.25);
  ctx.lineTo(SC.tl.x - pad * 0.6, SC.tl.y - pad * 0.25);
  ctx.closePath();
  ctx.fillStyle = '#1A0035';
  ctx.fill();
  ctx.fillStyle = '#0A001A';
  ctx.fill();
  ctx.restore();

  // ── Neon border ──
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(SC.bl.x, SC.bl.y);
  ctx.lineTo(SC.br.x, SC.br.y);
  ctx.lineTo(SC.tr.x, SC.tr.y);
  ctx.lineTo(SC.tl.x, SC.tl.y);
  ctx.closePath();
  ctx.strokeStyle = '#9B30FF';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#9B30FF';
  ctx.shadowBlur = 16;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // ── Screen clipped content ──
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(SC.bl.x, SC.bl.y);
  ctx.lineTo(SC.br.x, SC.br.y);
  ctx.lineTo(SC.tr.x, SC.tr.y);
  ctx.lineTo(SC.tl.x, SC.tl.y);
  ctx.closePath();
  ctx.fillStyle = '#020008';
  ctx.fill();
  ctx.clip();

  // Compute transform: chart [0..chartW] x [0..chartH] -> screen parallelogram
  var a  = (SC.br.x - SC.bl.x) / chartW;
  var b  = (SC.br.y - SC.bl.y) / chartW;
  var c2 = 0;
  var d  = (SC.tl.y - SC.bl.y) / chartH;
  var e  = SC.bl.x;
  var f  = SC.bl.y;

  // Apply canvas-level scale+pan on top of the chart transform
  ctx.setTransform(
    a * scale,
    b * scale,
    c2,
    d * scale,
    e * scale + panX,
    f * scale + panY
  );

  if (btcApiOk && btcKlines.length > 0) {
    drawChartContent();
  } else {
    // No-data state
    ctx.fillStyle = '#020008';
    ctx.fillRect(0, 0, chartW, chartH);

    ctx.fillStyle = '#FF2D78';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('⚠ DONNÉES INDISPONIBLES', chartW / 2, chartH / 2 - 10);

    ctx.font = '10px Courier New';
    ctx.fillStyle = '#550033';
    ctx.fillText('Connexion Binance impossible', chartW / 2, chartH / 2 + 12);
    ctx.fillText('Vérifiez votre connexion internet', chartW / 2, chartH / 2 + 26);
  }

  ctx.restore();

  // ── Recompute TF zones in un-scaled canvas coords ──
  recomputeTFZones(SC, a, b, d, e, f);
}

function recomputeTFZones(SC, a, b, d, e, f) {
  tfZones = [];
  TF_OPTIONS.forEach(function(tf, i) {
    var bx1 = 10 + i * 55;
    var bx2 = bx1 + 48;
    var by1 = 38;
    var by2 = 54;

    // Transform all 4 corners from chart-local to canvas coords (without scale/pan, since toCanvasCoords undoes those)
    function ct(cx, cy) {
      return { x: a * cx + e, y: b * cx + d * cy + f };
    }
    var corners = [ct(bx1, by1), ct(bx2, by1), ct(bx2, by2), ct(bx1, by2)];
    var xs = corners.map(function(p) { return p.x; });
    var ys = corners.map(function(p) { return p.y; });

    tfZones.push({
      label: tf, interval: tf,
      x1: Math.min.apply(null, xs),
      y1: Math.min.apply(null, ys),
      x2: Math.max.apply(null, xs),
      y2: Math.max.apply(null, ys)
    });
  });
}

// ─────────────────────────────────────────────────────────────────
// DRAW: TABLE
// ─────────────────────────────────────────────────────────────────
function drawTable(gx, gy, agent) {
  var dW = 1.8, dD = 1.2, dH = 0.6;
  var monW = 0.7, monH = 0.65;

  // Top face
  var tfl = iso(gx,      gy,      dH);
  var tfr = iso(gx + dW, gy,      dH);
  var tbr = iso(gx + dW, gy + dD, dH);
  var tbl = iso(gx,      gy + dD, dH);

  ctx.beginPath();
  ctx.moveTo(tfl.x, tfl.y);
  ctx.lineTo(tfr.x, tfr.y);
  ctx.lineTo(tbr.x, tbr.y);
  ctx.lineTo(tbl.x, tbl.y);
  ctx.closePath();

  var topGrad = ctx.createLinearGradient(tfl.x, tfl.y, tbr.x, tbr.y);
  topGrad.addColorStop(0, '#3A0A6A');
  topGrad.addColorStop(0.5, '#2D0A5A');
  topGrad.addColorStop(1, '#200840');
  ctx.fillStyle = topGrad;
  ctx.fill();
  ctx.strokeStyle = '#7B2FBE';
  ctx.lineWidth = 0.8;
  ctx.shadowColor = '#7B2FBE';
  ctx.shadowBlur = 4;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Left face
  ctx.beginPath();
  ctx.moveTo(tfl.x, tfl.y);
  ctx.lineTo(tbl.x, tbl.y);
  ctx.lineTo(iso(gx, gy + dD, 0).x, iso(gx, gy + dD, 0).y);
  ctx.lineTo(iso(gx, gy, 0).x, iso(gx, gy, 0).y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(26,0,56,0.85)';
  ctx.fill();

  // Right face
  ctx.beginPath();
  ctx.moveTo(tfr.x, tfr.y);
  ctx.lineTo(tbr.x, tbr.y);
  ctx.lineTo(iso(gx + dW, gy + dD, 0).x, iso(gx + dW, gy + dD, 0).y);
  ctx.lineTo(iso(gx + dW, gy, 0).x, iso(gx + dW, gy, 0).y);
  ctx.closePath();
  ctx.fillStyle = '#220045';
  ctx.fill();

  // Monitor (parallelogram on back edge of desk, facing viewer)
  var mx0 = gx + (dW - monW) / 2;
  var mx1 = mx0 + monW;
  var my = gy + 0.15;
  var mzBot = dH + 0.05;
  var mzTop = dH + monH;

  var mbl = iso(mx0, my, mzBot);
  var mbr = iso(mx1, my, mzBot);
  var mtr = iso(mx1, my, mzTop);
  var mtl = iso(mx0, my, mzTop);

  ctx.beginPath();
  ctx.moveTo(mbl.x, mbl.y);
  ctx.lineTo(mbr.x, mbr.y);
  ctx.lineTo(mtr.x, mtr.y);
  ctx.lineTo(mtl.x, mtl.y);
  ctx.closePath();

  if (agent) {
    ctx.shadowColor = agent.color;
    ctx.shadowBlur = 10;
    var monGrad = ctx.createLinearGradient(mbl.x, mbl.y, mtr.x, mtr.y);
    monGrad.addColorStop(0, '#08001A');
    monGrad.addColorStop(0.5, agent.color + '2A');
    monGrad.addColorStop(1, '#08001A');
    ctx.fillStyle = monGrad;
  } else {
    ctx.fillStyle = '#050010';
    ctx.shadowBlur = 0;
  }
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = agent ? agent.color : '#1A0028';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Store monitor click zone (in un-scaled coords)
  if (agent) {
    var pts = [mbl, mbr, mtr, mtl];
    var xs = pts.map(function(p) { return p.x; });
    var ys = pts.map(function(p) { return p.y; });
    var found = false;
    for (var i = 0; i < monitorZones.length; i++) {
      if (monitorZones[i].agent.id === agent.id) {
        monitorZones[i] = { x1: Math.min.apply(null,xs), y1: Math.min.apply(null,ys), x2: Math.max.apply(null,xs), y2: Math.max.apply(null,ys), agent: agent };
        found = true; break;
      }
    }
    if (!found) {
      monitorZones.push({ x1: Math.min.apply(null,xs), y1: Math.min.apply(null,ys), x2: Math.max.apply(null,xs), y2: Math.max.apply(null,ys), agent: agent });
    }
  }

  // Chair
  var cxPos = gx + dW / 2 - 0.25;
  var chBase = iso(cxPos, gy + dD + 0.35, 0.1);
  ctx.fillStyle = '#150028';
  ctx.strokeStyle = '#3A0060';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.ellipse(chBase.x, chBase.y, TW * 0.22, TH * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

// ─────────────────────────────────────────────────────────────────
// DRAW: HUMAN FIGURE
// ─────────────────────────────────────────────────────────────────
function drawHuman(sx, sy, agent, state, walkPhase) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + 18, 7, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  var legSwing = (state === 'to_break' || state === 'returning') ? Math.sin(walkPhase) * 5 : 0;
  ctx.fillStyle = agent.pants;
  ctx.fillRect(sx - 5, sy + 7, 4, 9);
  ctx.fillRect(sx + 1, sy + 7 + legSwing, 4, 9);

  // Torso
  if (state === 'working') {
    ctx.shadowColor = agent.color;
    ctx.shadowBlur = 8;
  }
  ctx.fillStyle = agent.color;
  ctx.fillRect(sx - 6, sy - 3, 12, 10);
  ctx.shadowBlur = 0;

  // Arms
  ctx.fillStyle = agent.skin;
  if (state === 'working') {
    ctx.fillRect(sx - 9, sy + 1, 4, 6);
    ctx.fillRect(sx + 5, sy + 1, 4, 6);
  } else {
    ctx.fillRect(sx - 8, sy, 3, 7);
    ctx.fillRect(sx + 5, sy, 3, 7);
  }

  // Neck
  ctx.fillStyle = agent.skin;
  ctx.fillRect(sx - 2, sy - 8, 5, 6);

  // Head
  ctx.beginPath();
  ctx.ellipse(sx, sy - 12, 7, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = agent.skin;
  ctx.fill();

  // Hair
  ctx.beginPath();
  ctx.ellipse(sx, sy - 14, 7, 4, 0, Math.PI, 0);
  ctx.fillStyle = '#1A0A08';
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#111';
  ctx.fillRect(sx - 4, sy - 13, 2, 2);
  ctx.fillRect(sx + 2, sy - 13, 2, 2);

  // Pulsing neon dot above head
  var pulse = 0.6 + 0.4 * Math.sin(Date.now() / 500 + agent.gx);
  ctx.shadowColor = agent.color;
  ctx.shadowBlur = 8 * pulse;
  ctx.fillStyle = agent.color;
  ctx.beginPath();
  ctx.arc(sx, sy - 24, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Name tag pill
  ctx.font = '9px Courier New';
  ctx.textAlign = 'center';
  var tw = ctx.measureText(agent.name).width + 8;
  var ty = sy - 34;
  ctx.fillStyle = 'rgba(0,0,10,0.8)';
  ctx.fillRect(sx - tw / 2, ty - 9, tw, 12);
  ctx.strokeStyle = agent.color;
  ctx.lineWidth = 0.5;
  ctx.strokeRect(sx - tw / 2, ty - 9, tw, 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(agent.name, sx, ty);
}

// ─────────────────────────────────────────────────────────────────
// DRAW: PLANT
// ─────────────────────────────────────────────────────────────────
function drawPlant(gx, gy) {
  var base = iso(gx + 0.5, gy + 0.5, 0);
  var t = Date.now() / 2200;
  var sway = Math.sin(t + gx * 0.7) * 2.5;

  // Pot
  ctx.fillStyle = '#3A1A08';
  ctx.strokeStyle = '#5A2A10';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(base.x - 10, base.y - 2);
  ctx.lineTo(base.x + 10, base.y - 2);
  ctx.lineTo(base.x + 8, base.y + 6);
  ctx.lineTo(base.x - 8, base.y + 6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Soil
  ctx.fillStyle = '#1A0A04';
  ctx.beginPath();
  ctx.ellipse(base.x, base.y - 2, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Foliage layers
  var greens = ['#0A2A0A', '#0F3A0F', '#164416', '#1B4A10', '#0D3506'];
  ctx.shadowColor = '#00AA33';
  greens.forEach(function(g, i) {
    ctx.fillStyle = g;
    ctx.shadowBlur = i === 2 ? 4 : 1;
    ctx.beginPath();
    ctx.ellipse(
      base.x + sway * (i * 0.25),
      base.y - 16 - i * 6,
      13 - i * 1.2,
      11 - i * 1.0,
      0, 0, Math.PI * 2
    );
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}

// ─────────────────────────────────────────────────────────────────
// DRAW: SERVER RACK
// ─────────────────────────────────────────────────────────────────
function drawServer(gx, gy) {
  var w = 1.2, d = 0.8, h = 3.5;
  var fade = 1.0 - (gy / 12) * 0.15;
  ctx.globalAlpha = fade;

  // Front face (visible from isometric view)
  var tl = iso(gx,     gy, h);
  var tr = iso(gx + w, gy, h);
  var br = iso(gx + w, gy, 0);
  var bl = iso(gx,     gy, 0);

  ctx.beginPath();
  ctx.moveTo(bl.x, bl.y);
  ctx.lineTo(br.x, br.y);
  ctx.lineTo(tr.x, tr.y);
  ctx.lineTo(tl.x, tl.y);
  ctx.closePath();
  ctx.fillStyle = '#0A0A14';
  ctx.fill();
  ctx.strokeStyle = '#1A1A30';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Side face
  var rbl = iso(gx + w, gy,     0);
  var rbr = iso(gx + w, gy + d, 0);
  var rtr = iso(gx + w, gy + d, h);
  var rtl = iso(gx + w, gy,     h);

  ctx.beginPath();
  ctx.moveTo(rbl.x, rbl.y);
  ctx.lineTo(rbr.x, rbr.y);
  ctx.lineTo(rtr.x, rtr.y);
  ctx.lineTo(rtl.x, rtl.y);
  ctx.closePath();
  ctx.fillStyle = '#060610';
  ctx.fill();

  // Top face
  var ctl = iso(gx,     gy,     h);
  var ctr = iso(gx + w, gy,     h);
  var cbr = iso(gx + w, gy + d, h);
  var cbl = iso(gx,     gy + d, h);

  ctx.beginPath();
  ctx.moveTo(ctl.x, ctl.y);
  ctx.lineTo(ctr.x, ctr.y);
  ctx.lineTo(cbr.x, cbr.y);
  ctx.lineTo(cbl.x, cbl.y);
  ctx.closePath();
  ctx.fillStyle = '#0D0D20';
  ctx.fill();

  // Rack unit lines
  for (var u = 1; u <= 5; u++) {
    var lu = iso(gx,     gy, u * h / 6);
    var ru = iso(gx + w, gy, u * h / 6);
    ctx.beginPath();
    ctx.moveTo(lu.x, lu.y);
    ctx.lineTo(ru.x, ru.y);
    ctx.strokeStyle = '#1A1A2A';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // LEDs
  ledStates.forEach(function(on, idx) {
    var ledFrac = (idx + 0.5) / ledStates.length;
    var lPos = iso(gx + 0.12, gy, h * ledFrac);
    if (on) {
      ctx.fillStyle = ledColors[idx];
      ctx.shadowColor = ledColors[idx];
      ctx.shadowBlur = 6;
    } else {
      ctx.fillStyle = '#111122';
      ctx.shadowBlur = 0;
    }
    ctx.beginPath();
    ctx.arc(lPos.x, lPos.y, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────────────────────
// DRAW: COFFEE STATION
// ─────────────────────────────────────────────────────────────────
function drawCoffee(gx, gy) {
  var fade = 1.0 - (gy / 12) * 0.15;
  ctx.globalAlpha = fade;

  var base = iso(gx, gy, 0);
  var top  = iso(gx, gy, 1.0);

  // Machine body
  ctx.fillStyle = '#1A1A2A';
  ctx.fillRect(base.x - 16, top.y, 32, base.y - top.y);
  ctx.strokeStyle = '#3A3A5A';
  ctx.lineWidth = 0.8;
  ctx.strokeRect(base.x - 16, top.y, 32, base.y - top.y);

  // Screen panel
  ctx.fillStyle = '#001122';
  ctx.fillRect(base.x - 10, top.y + 4, 20, 11);
  ctx.fillStyle = '#00AAFF';
  ctx.font = '6px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('CAFÉ', base.x, top.y + 13);

  // Coffee dispenser nozzle
  ctx.fillStyle = '#333344';
  ctx.fillRect(base.x - 3, base.y - 12, 6, 8);

  // Steam particles
  steamParticles.forEach(function(p) {
    ctx.globalAlpha = fade * p.life * 0.45;
    ctx.fillStyle = '#AAAACC';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────────────────────
// DRAW: WATER DISPENSER
// ─────────────────────────────────────────────────────────────────
function drawWater(gx, gy) {
  var fade = 1.0 - (gy / 12) * 0.15;
  ctx.globalAlpha = fade;

  var base = iso(gx, gy, 0);
  var top  = iso(gx, gy, 1.5);
  var mid  = { x: base.x, y: (base.y + top.y) / 2 };
  var halfH = (base.y - top.y) / 2;

  // Body
  ctx.fillStyle = '#082030';
  ctx.beginPath();
  ctx.ellipse(mid.x, mid.y, 14, halfH, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = '#0088FF';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#0066BB';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(mid.x, mid.y, 14, halfH, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Water bottle top
  ctx.fillStyle = '#003366AA';
  ctx.strokeStyle = '#0055AA';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.ellipse(base.x, top.y + 6, 9, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────────────────────
// TABLE LAYOUT
// ─────────────────────────────────────────────────────────────────
var TABLE_ROWS = [
  { gy: 2,  gxs: [2, 5, 8, 11] },
  { gy: 4,  gxs: [2, 5, 8, 11] },
  { gy: 6,  gxs: [2, 5, 8, 11] },
  { gy: 8,  gxs: [2, 5, 8, 11] }
];

function findAgentAt(gx, gy) {
  return AGENTS.find(function(a) { return a.gx === gx && a.gy === gy; }) || null;
}

// ─────────────────────────────────────────────────────────────────
// PAINTER'S ALGORITHM + DRAW
// ─────────────────────────────────────────────────────────────────
function buildAndDraw() {
  var items = [];

  // Tables
  TABLE_ROWS.forEach(function(row) {
    row.gxs.forEach(function(gx) {
      items.push({ type: 'table', gx: gx, gy: row.gy, depth: gx + row.gy });
    });
  });

  // Agents
  AGENTS.forEach(function(agent) {
    var st = agentStates[agent.id];
    items.push({
      type: 'agent', agent: agent,
      wx: st.wx, wy: st.wy,
      depth: st.wx + st.wy + 0.5
    });
  });

  // Plants
  [{gx:1,gy:1},{gx:15,gy:1},{gx:1,gy:10},{gx:15,gy:10}].forEach(function(p) {
    items.push({ type: 'plant', gx: p.gx, gy: p.gy, depth: p.gx + p.gy });
  });

  // Server
  items.push({ type: 'server', gx: 15, gy: 5, depth: 20.1 });

  // Coffee
  items.push({ type: 'coffee', gx: 14, gy: 9, depth: 23.1 });

  // Water
  items.push({ type: 'water', gx: 1, gy: 9, depth: 10.1 });

  items.sort(function(a, b) { return a.depth - b.depth; });

  monitorZones = [];

  items.forEach(function(item) {
    if (item.type === 'table') {
      drawTable(item.gx, item.gy, findAgentAt(item.gx, item.gy));
    } else if (item.type === 'agent') {
      var pos = iso(item.wx, item.wy, 0);
      var st = agentStates[item.agent.id];
      drawHuman(pos.x, pos.y - 6, item.agent, st.state, agentWalkPhase[item.agent.id]);
    } else if (item.type === 'plant') {
      drawPlant(item.gx, item.gy);
    } else if (item.type === 'server') {
      drawServer(item.gx, item.gy);
    } else if (item.type === 'coffee') {
      drawCoffee(item.gx, item.gy);
    } else if (item.type === 'water') {
      drawWater(item.gx, item.gy);
    }
  });
}

// ─────────────────────────────────────────────────────────────────
// MAIN RENDER LOOP
// ─────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  // Background radial gradient
  var bg = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 500);
  bg.addColorStop(0, '#14002A');
  bg.addColorStop(1, '#050008');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(scale, scale);

  drawWalls();
  drawScreen();
  drawFloor();
  buildAndDraw();
  updateSteam();

  ctx.restore();

  updateAgents();
  requestAnimationFrame(render);
}

render();
</script>
</body>
