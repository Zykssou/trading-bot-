<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Bot — Tournament</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  .header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 17px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #7d8590; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* GLOBAL STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    padding: 20px 24px 10px;
  }
  .stat-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
  }
  .stat-card .lbl { font-size: 11px; color: #7d8590; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-card .val { font-size: 24px; font-weight: 700; }
  .stat-card .sub { font-size: 11px; color: #7d8590; margin-top: 3px; }

  /* TABLE */
  .section { padding: 16px 24px 40px; }
  .section-title {
    font-size: 12px;
    color: #7d8590;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title span { color: #30363d; }

  table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  thead th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    color: #7d8590;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid #30363d;
    background: #161b22;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  thead th:hover { color: #e6edf3; }
  thead th.sorted { color: #58a6ff; }
  tbody tr { border-bottom: 1px solid #21262d; cursor: pointer; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover td { background: #1c2128; }
  tbody td { padding: 11px 14px; font-size: 13px; }

  /* special row for bot 0 */
  tbody tr.bot-main td { background: rgba(88,166,255,0.04); }
  tbody tr.bot-main:hover td { background: rgba(88,166,255,0.09); }

  .num { font-weight: 700; color: #7d8590; font-size: 12px; }
  .bot-main .num { color: #58a6ff; }

  .name-cell .name { font-weight: 600; }
  .name-cell .strat { font-size: 11px; color: #7d8590; margin-top: 1px; }

  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    background: #21262d;
    color: #7d8590;
    white-space: nowrap;
  }
  .badge-main { background: #132240; color: #58a6ff; }

  .val-pos { color: #3fb950; font-weight: 600; }
  .val-neg { color: #f85149; font-weight: 600; }
  .val-neu { color: #e6edf3; }

  .wr-bar-wrap { background: #21262d; border-radius: 3px; height: 4px; width: 60px; overflow: hidden; margin-top: 3px; }
  .wr-bar { height: 100%; background: #3fb950; border-radius: 3px; transition: width .3s; }
  .wr-bad { background: #f85149; }

  .rank-1 .num::before { content: "🥇 "; }
  .rank-2 .num::before { content: "🥈 "; }
  .rank-3 .num::before { content: "🥉 "; }

  .positions-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3fb950;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* MODAL */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .mbox { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 24px; max-width: 520px; width: 94%; max-height: 85vh; overflow-y: auto; position: relative; }
  .mclose { position: absolute; top: 14px; right: 16px; font-size: 20px; cursor: pointer; color: #7d8590; line-height: 1; }
  .mclose:hover { color: #f85149; }
  .m-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .m-sub { font-size: 12px; color: #7d8590; margin-bottom: 18px; }
  .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .m-cell { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; }
  .m-lbl { font-size: 10px; color: #7d8590; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .m-val { font-size: 16px; font-weight: 700; }
  .m-section { font-size: 11px; color: #7d8590; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 8px; }
  .pos-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
  .pos-row:last-child { border-bottom: none; }
  .empty { color: #7d8590; font-size: 13px; padding: 8px 0; }

  /* loading */
  .loading { text-align: center; color: #7d8590; padding: 60px; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <h1>🤖 Bot de Trading — Tournament</h1>
  <div class="status">
    <div class="dot"></div>
    <span id="update-time">Chargement...</span>
    <a href="/dashboard" style="margin-left:12px;color:#58a6ff;text-decoration:none;font-size:12px">Détails →</a>
  </div>
</div>

<!-- GLOBAL STATS -->
<div class="stats-grid" id="stats-grid">
  <div class="stat-card"><div class="lbl">Capital total</div><div class="val" id="g-capital">—</div><div class="sub">26 traders × 1000€</div></div>
  <div class="stat-card"><div class="lbl">Valeur actuelle</div><div class="val" id="g-value">—</div><div class="sub" id="g-value-sub">—</div></div>
  <div class="stat-card"><div class="lbl">P&L global</div><div class="val" id="g-pnl">—</div><div class="sub" id="g-pnl-pct">—</div></div>
  <div class="stat-card"><div class="lbl">Meilleur trader</div><div class="val" id="g-best">—</div><div class="sub" id="g-best-sub">—</div></div>
  <div class="stat-card"><div class="lbl">Pire trader</div><div class="val" id="g-worst">—</div><div class="sub" id="g-worst-sub">—</div></div>
  <div class="stat-card"><div class="lbl">Trades fermés</div><div class="val" id="g-trades">—</div><div class="sub" id="g-wr">—</div></div>
</div>

<!-- TABLE -->
<div class="section">
  <div class="section-title">Classement <span>— cliquez sur un trader pour le détail</span></div>
  <div id="table-wrap">
    <div class="loading">Chargement des données...</div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <span class="mclose" onclick="closeModal()">✕</span>
    <div class="m-title" id="m-title"></div>
    <div class="m-sub" id="m-sub"></div>
    <div class="m-grid" id="m-grid"></div>
    <div class="m-section">Positions ouvertes</div>
    <div id="m-positions"><div class="empty">Aucune position ouverte</div></div>
  </div>
</div>

<script>
'use strict';

let allTraders = [];   // traders 1-25
let botData   = null;  // trader 0 (main bot)
let sortCol   = 'pnl';
let sortDir   = -1;    // -1 = desc

const INITIAL = 1000;
const TOTAL_CAPITAL = 26 * INITIAL;

// ── FETCH ──────────────────────────────────────────────────────────────────

async function fetchData() {
  try {
    const [agentsRes, tradersRes] = await Promise.all([
      fetch('/api/agents'),
      fetch('/api/traders')
    ]);
    const agents  = await agentsRes.json();
    const traders = await tradersRes.json();

    const s = agents._stats || {};
    // Build bot 0 object matching trader format
    botData = {
      id: 0,
      name: 'Bot Principal',
      strategy: 'Main',
      description: 'Stratégie principale du bot — orchestre tous les agents.',
      balance: s.balance || INITIAL,
      total_value: s.total_value || (s.balance || INITIAL),
      pnl: s.pnl || 0,
      pnl_pct: s.pnl ? (s.pnl / INITIAL * 100) : 0,
      open_positions: s.positions || 0,
      total_trades: s.total_trades || 0,
      win_rate: s.win_rate || 0,
      stake_pct: 5,
      sl: 5,
      tp: 10,
      _raw_agents: agents,
    };

    allTraders = Array.isArray(traders) ? traders : [];
    render();
  } catch(e) {
    console.error(e);
    document.getElementById('table-wrap').innerHTML = '<div class="loading">Erreur de chargement — vérifiez que le bot tourne.</div>';
  }
}

// ── RENDER ─────────────────────────────────────────────────────────────────

function render() {
  document.getElementById('update-time').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR');

  const rows = buildRows();
  renderGlobal(rows);
  renderTable(rows);
}

function buildRows() {
  const rows = [];

  // Bot 0
  if (botData) rows.push({ ...botData, _isBot: true });

  // Traders 1-25
  for (const t of allTraders) {
    rows.push({ ...t, _isBot: false });
  }

  return rows;
}

function renderGlobal(rows) {
  const totalValue   = rows.reduce((s, r) => s + (r.total_value || INITIAL), 0);
  const totalPnl     = totalValue - TOTAL_CAPITAL;
  const totalPnlPct  = (totalPnl / TOTAL_CAPITAL * 100);
  const totalTrades  = rows.reduce((s, r) => s + (typeof r.total_trades === 'number' ? r.total_trades : 0), 0);
  const totalWins    = rows.reduce((s, r) => {
    const t = typeof r.total_trades === 'number' ? r.total_trades : 0;
    return s + Math.round(t * (r.win_rate / 100));
  }, 0);
  const globalWR     = totalTrades > 0 ? Math.round(totalWins / totalTrades * 100) : 0;

  const sorted = [...rows].sort((a, b) => (b.pnl || 0) - (a.pnl || 0));
  const best   = sorted[0];
  const worst  = sorted[sorted.length - 1];

  document.getElementById('g-capital').textContent  = TOTAL_CAPITAL.toLocaleString('fr-FR') + '€';
  document.getElementById('g-value').textContent    = Math.round(totalValue).toLocaleString('fr-FR') + '€';
  document.getElementById('g-value-sub').textContent = (totalPnl >= 0 ? '+' : '') + Math.round(totalPnl) + '€ vs départ';

  const pnlEl = document.getElementById('g-pnl');
  pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + Math.round(totalPnl) + '€';
  pnlEl.className = 'val ' + (totalPnl >= 0 ? 'val-pos' : 'val-neg');
  document.getElementById('g-pnl-pct').textContent = (totalPnlPct >= 0 ? '+' : '') + totalPnlPct.toFixed(2) + '%';

  if (best) {
    const bestEl = document.getElementById('g-best');
    bestEl.textContent = '#' + best.id + ' ' + best.strategy;
    bestEl.className = 'val val-pos';
    document.getElementById('g-best-sub').textContent = (best.pnl >= 0 ? '+' : '') + (best.pnl || 0).toFixed(2) + '€ (' + (best.pnl_pct || 0).toFixed(1) + '%)';
  }
  if (worst) {
    const worstEl = document.getElementById('g-worst');
    worstEl.textContent = '#' + worst.id + ' ' + worst.strategy;
    worstEl.className = 'val val-neg';
    document.getElementById('g-worst-sub').textContent = (worst.pnl >= 0 ? '+' : '') + (worst.pnl || 0).toFixed(2) + '€ (' + (worst.pnl_pct || 0).toFixed(1) + '%)';
  }

  document.getElementById('g-trades').textContent = totalTrades;
  document.getElementById('g-wr').textContent = 'Win rate global: ' + globalWR + '%';
}

function renderTable(rows) {
  // Sort
  const sorted = [...rows].sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (typeof av === 'string') av = parseFloat(av) || 0;
    if (typeof bv === 'string') bv = parseFloat(bv) || 0;
    return (av - bv) * sortDir;
  });

  // Rank by pnl for medal
  const byPnl = [...rows].sort((a, b) => (b.pnl || 0) - (a.pnl || 0));
  const rankMap = {};
  byPnl.forEach((r, i) => { rankMap[r.id] = i + 1; });

  const cols = [
    { key: 'id',            label: '#' },
    { key: 'name',          label: 'Trader' },
    { key: 'balance',       label: 'Balance' },
    { key: 'total_value',   label: 'Valeur totale' },
    { key: 'pnl',           label: 'P&L (€)' },
    { key: 'pnl_pct',       label: 'P&L (%)' },
    { key: 'total_trades',  label: 'Trades' },
    { key: 'win_rate',      label: 'Win Rate' },
    { key: 'open_positions',label: 'Positions' },
  ];

  let html = '<table><thead><tr>';
  for (const c of cols) {
    const cls = sortCol === c.key ? 'sorted' : '';
    html += `<th class="${cls}" onclick="setSort('${c.key}')">${c.label}${sortCol===c.key?(sortDir===-1?' ↓':' ↑'):''}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (const r of sorted) {
    const rank = rankMap[r.id];
    const rankCls = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
    const rowCls  = r._isBot ? 'bot-main ' + rankCls : rankCls;
    const pnl     = r.pnl || 0;
    const pnlPct  = r.pnl_pct || 0;
    const wr      = r.win_rate || 0;
    const trades  = typeof r.total_trades === 'number' ? r.total_trades : r.total_trades || 0;
    const tv      = r.total_value || INITIAL;
    const bal     = r.balance || INITIAL;
    const pos     = r.open_positions || 0;

    html += `<tr class="${rowCls}" onclick="openTrader(${r.id})">`;
    html += `<td><span class="num">${r.id}</span></td>`;
    html += `<td>
      <div class="name-cell">
        <div class="name">${r.name} <span class="badge ${r._isBot ? 'badge-main' : ''}">${r.strategy}</span></div>
        <div class="strat">${r.description || ''}</div>
      </div>
    </td>`;
    html += `<td class="val-neu">${bal.toFixed(2)}€</td>`;
    html += `<td class="${tv >= INITIAL ? 'val-pos' : 'val-neg'}">${tv.toFixed(2)}€</td>`;
    html += `<td class="${pnl >= 0 ? 'val-pos' : 'val-neg'}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}€</td>`;
    html += `<td class="${pnlPct >= 0 ? 'val-pos' : 'val-neg'}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</td>`;
    html += `<td class="val-neu">${trades}</td>`;
    html += `<td>
      <div>${wr}%</div>
      <div class="wr-bar-wrap"><div class="wr-bar ${wr < 40 ? 'wr-bad' : ''}" style="width:${Math.min(100,wr)}%"></div></div>
    </td>`;
    html += `<td>${pos > 0 ? '<span class="positions-dot"></span>' : ''}${pos}</td>`;
    html += '</tr>';
  }

  html += '</tbody></table>';
  document.getElementById('table-wrap').innerHTML = html;
}

// ── SORT ───────────────────────────────────────────────────────────────────

function setSort(col) {
  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = -1;
  }
  renderTable(buildRows());
}

// ── MODAL ──────────────────────────────────────────────────────────────────

async function openTrader(id) {
  const rows = buildRows();
  const r = rows.find(x => x.id === id);
  if (!r) return;

  document.getElementById('m-title').textContent = '#' + r.id + ' — ' + r.name;
  document.getElementById('m-sub').textContent   = r.description || r.strategy;

  const pnl    = r.pnl || 0;
  const pnlPct = r.pnl_pct || 0;
  const wr     = r.win_rate || 0;
  const trades = typeof r.total_trades === 'number' ? r.total_trades : 0;

  document.getElementById('m-grid').innerHTML = `
    <div class="m-cell"><div class="m-lbl">Balance</div><div class="m-val">${(r.balance||INITIAL).toFixed(2)}€</div></div>
    <div class="m-cell"><div class="m-lbl">Valeur totale</div><div class="m-val ${(r.total_value||INITIAL)>=INITIAL?'val-pos':'val-neg'}">${(r.total_value||INITIAL).toFixed(2)}€</div></div>
    <div class="m-cell"><div class="m-lbl">P&L</div><div class="m-val ${pnl>=0?'val-pos':'val-neg'}">${pnl>=0?'+':''}${pnl.toFixed(2)}€</div></div>
    <div class="m-cell"><div class="m-lbl">P&L %</div><div class="m-val ${pnlPct>=0?'val-pos':'val-neg'}">${pnlPct>=0?'+':''}${pnlPct.toFixed(2)}%</div></div>
    <div class="m-cell"><div class="m-lbl">Trades fermés</div><div class="m-val">${trades}</div></div>
    <div class="m-cell"><div class="m-lbl">Win Rate</div><div class="m-val ${wr>=50?'val-pos':'val-neg'}">${wr}%</div></div>
    ${r.sl !== undefined ? `<div class="m-cell"><div class="m-lbl">Stop-Loss</div><div class="m-val val-neg">-${r.sl}%</div></div>` : ''}
    ${r.tp !== undefined ? `<div class="m-cell"><div class="m-lbl">Take-Profit</div><div class="m-val val-pos">+${r.tp}%</div></div>` : ''}
  `;

  // Load open positions
  let posHtml = '<div class="empty">Aucune position ouverte</div>';
  if (id > 0) {
    try {
      const res = await fetch('/api/traders');
      const traders = await res.json();
      const t = traders.find(x => x.id === id);
      if (t && t.positions_detail && t.positions_detail.length > 0) {
        posHtml = t.positions_detail.map(p => `
          <div class="pos-row">
            <span>${p.coin.toUpperCase()} <span style="color:#7d8590;font-size:11px">${p.position_type}</span></span>
            <span class="${p.pnl>=0?'val-pos':'val-neg'}">${p.pnl>=0?'+':''}${p.pnl.toFixed(2)}€</span>
          </div>
        `).join('');
      }
    } catch(e) {}
  } else if (r._raw_agents) {
    const ag = r._raw_agents;
    const trader = ag.trader;
    if (trader && trader.logs && trader.logs.length) {
      posHtml = trader.logs.map(l => `
        <div class="pos-row"><span style="color:#7d8590;font-size:12px">${l.text}</span></div>
      `).join('');
    }
  }

  document.getElementById('m-positions').innerHTML = posHtml;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ── INIT & AUTO-REFRESH ────────────────────────────────────────────────────

fetchData();
setInterval(fetchData, 30000);
</script>
</body>
</html>
