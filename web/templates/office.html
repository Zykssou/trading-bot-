<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neural Trading Floor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #050008; color: #e0e0ff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* HEADER */
    .header { background: #080012; border-bottom: 1px solid #3A0060; padding: 7px 16px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; flex-wrap: wrap; z-index: 10; }
    .logo { color: #FF2D78; font-size: 13px; font-weight: bold; letter-spacing: 3px; white-space: nowrap; }
    .hstats { display: flex; gap: 16px; flex: 1; justify-content: center; flex-wrap: wrap; }
    .hstat { display: flex; flex-direction: column; align-items: center; }
    .hl { font-size: 7px; color: #440055; text-transform: uppercase; letter-spacing: 1px; }
    .hv { font-size: 12px; font-weight: bold; color: #AA44FF; }
    .hv.pos { color: #00FFCC; }
    .hv.neg { color: #FF2D78; }
    .rbtn { background: #1A0030; border: 1px solid #6600BB; color: #AA44FF; padding: 4px 12px; font-family: 'Courier New', monospace; font-size: 10px; cursor: pointer; border-radius: 2px; white-space: nowrap; }
    .rbtn:hover { background: #2A0050; }

    /* MAIN LAYOUT */
    .main { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* LEFT PANEL */
    .lpanel { width: 155px; flex-shrink: 0; background: rgba(5,0,15,0.95); border-right: 1px solid #2A0045; padding: 12px 8px; overflow-y: auto; z-index: 5; }
    .panel-title { font-size: 8px; color: #440055; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #1A0030; }
    .agent-pill { display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 3px; cursor: pointer; margin-bottom: 4px; font-size: 10px; color: #AAAACC; border: 1px solid; transition: all 0.15s; background: rgba(10,0,25,0.6); }
    .agent-pill:hover { background: rgba(25,0,50,0.9); color: #fff; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .lpanel-footer { margin-top: 12px; font-size: 7px; color: #220033; line-height: 1.8; }

    /* CANVAS WRAP */
    .cwrap { flex: 1; position: relative; overflow: hidden; }
    canvas { display: block; cursor: grab; width: 100%; height: 100%; }
    canvas:active { cursor: grabbing; }

    /* RIGHT PANEL */
    .rpanel { width: 175px; flex-shrink: 0; background: rgba(5,0,15,0.95); border-left: 1px solid #2A0045; padding: 12px 8px; overflow-y: auto; z-index: 5; }
    .lb-row { display: flex; justify-content: space-between; padding: 4px 5px; border-bottom: 1px solid #0D0018; font-size: 9px; border-radius: 2px; margin-bottom: 1px; }
    .lb-row:hover { background: #110022; cursor: pointer; }
    .lb-name { color: #AA88CC; }
    .lb-pnl { font-weight: bold; }
    .lb-pnl.pos { color: #00FFCC; }
    .lb-pnl.neg { color: #FF2D78; }
    .lb-rank { color: #553366; font-size: 8px; margin-right: 4px; }

    /* MODAL OVERLAY */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(3,0,8,0.82); z-index: 100; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .mbox { background: rgba(5,0,18,0.98); border: 1px solid #440077; border-radius: 4px; padding: 20px; max-width: 500px; width: 92%; max-height: 88vh; overflow-y: auto; position: relative; box-shadow: 0 0 40px rgba(100,0,200,0.3); }
    .mclose { position: absolute; top: 10px; right: 14px; font-size: 18px; cursor: pointer; color: #553366; line-height: 1; }
    .mclose:hover { color: #FF2D78; }
    .m-name { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .m-role { font-size: 10px; color: #553366; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; }
    .m-desc { font-size: 11px; color: #7755AA; margin-bottom: 14px; line-height: 1.5; }
    .m-badge { display: inline-block; font-size: 8px; padding: 2px 8px; border-radius: 10px; margin-bottom: 14px; letter-spacing: 1px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .info-cell { background: rgba(20,0,40,0.8); border: 1px solid #1A0030; border-radius: 3px; padding: 8px; }
    .info-lbl { font-size: 7px; color: #553366; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .info-val { font-size: 12px; font-weight: bold; color: #CC88FF; }
    .info-val.pos { color: #00FFCC; }
    .info-val.neg { color: #FF2D78; }
    .terminal { background: #020008; border: 1px solid #1A0030; border-radius: 3px; padding: 10px; font-size: 9px; line-height: 1.7; max-height: 140px; overflow-y: auto; }
    .terminal .t-ok { color: #00FFCC; }
    .terminal .t-warn { color: #FFAA00; }
    .terminal .t-err { color: #FF2D78; }
    .trader-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .ts-cell { background: rgba(15,0,30,0.9); border: 1px solid #1A0030; border-radius: 3px; padding: 7px; }
    .ts-lbl { font-size: 7px; color: #553366; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .ts-val { font-size: 11px; font-weight: bold; color: #AA88CC; }
    .ts-val.pos { color: #00FFCC; }
    .ts-val.neg { color: #FF2D78; }
    .ranking-bar { background: rgba(15,0,30,0.9); border: 1px solid #1A0030; border-radius: 3px; padding: 8px 10px; margin-bottom: 12px; font-size: 11px; }
    .positions-list { margin-top: 8px; }
    .pos-item { display: flex; justify-content: space-between; padding: 4px 6px; border-bottom: 1px solid #0A0015; font-size: 9px; }
    .pos-sym { color: #CC88FF; }
    .pos-side { color: #888; }
    .pos-pnl { font-weight: bold; }

    /* TIMEFRAME BUTTONS */
    .tf-btn { background: #0D001A; border: 1px solid #2A0045; color: #553366; padding: 2px 7px; font-size: 9px; font-family: 'Courier New', monospace; cursor: pointer; border-radius: 2px; transition: all 0.1s; }
    .tf-btn.active, .tf-btn:hover { background: #1A0030; border-color: #6600BB; color: #AA44FF; }

    /* TOOLTIP */
    #tooltip { position: fixed; pointer-events: none; background: rgba(5,0,18,0.95); border: 1px solid #330055; border-radius: 3px; padding: 5px 9px; font-size: 9px; color: #CC88FF; z-index: 50; display: none; white-space: nowrap; }
  </style>
</head>

<script>
'use strict';

// ─── CONFIG ──────────────────────────────────────────────────────────────────
const W = 1100, H = 640;
const TW = 56, TH = 28, WH = 32;
const OX = 320, OY = 60;

function iso(gx, gy, gz=0) {
  return { x: OX + (gx - gy) * TW / 2, y: OY + (gx + gy) * TH / 2 - gz * WH };
}

// ─── BASE AGENTS ─────────────────────────────────────────────────────────────
const BASE_AGENTS = [
  { id:'scanner',   name:'Scanner',   role:'Market Watch',    color:'#00FFCC', gx:1, gy:2 },
  { id:'analyste',  name:'Analyste',  role:'Signal Analysis', color:'#00AAFF', gx:1, gy:3 },
  { id:'risk',      name:'Risk Mgr',  role:'Risk Control',    color:'#FF4488', gx:1, gy:4 },
  { id:'portfolio', name:'Portfolio', role:'Asset Manager',   color:'#44FF88', gx:1, gy:5 },
  { id:'reporter',  name:'Reporter',  role:'Telegram Alerts', color:'#CC88FF', gx:1, gy:6 },
  { id:'trader',    name:'★ Trader',  role:'Main Executor',   color:'#FFD700', gx:1, gy:7 },
];

// ─── 25 TRADERS ──────────────────────────────────────────────────────────────
const TRADERS_GRID = [
  {num:1,  name:'Trader 1',  strategy:'Base',          gx:4,  gy:2},
  {num:2,  name:'Trader 2',  strategy:'Conservateur',  gx:7,  gy:2},
  {num:3,  name:'Trader 3',  strategy:'Agressif',      gx:10, gy:2},
  {num:4,  name:'Trader 4',  strategy:'Scalper',       gx:13, gy:2},
  {num:5,  name:'Trader 5',  strategy:'Patience',      gx:16, gy:2},
  {num:6,  name:'Trader 6',  strategy:'Mème Only',     gx:4,  gy:4},
  {num:7,  name:'Trader 7',  strategy:'Blue Chip',     gx:7,  gy:4},
  {num:8,  name:'Trader 8',  strategy:'Long Only',     gx:10, gy:4},
  {num:9,  name:'Trader 9',  strategy:'Short Only',    gx:13, gy:4},
  {num:10, name:'Trader 10', strategy:'Volume+',       gx:16, gy:4},
  {num:11, name:'Trader 11', strategy:'Momentum+',     gx:4,  gy:6},
  {num:12, name:'Trader 12', strategy:'Anti-Panique',  gx:7,  gy:6},
  {num:13, name:'Trader 13', strategy:'Small Stake',   gx:10, gy:6},
  {num:14, name:'Trader 14', strategy:'Big Stake',     gx:13, gy:6},
  {num:15, name:'Trader 15', strategy:'DeFi Focus',    gx:16, gy:6},
  {num:16, name:'Trader 16', strategy:'SOL Eco',       gx:4,  gy:8},
  {num:17, name:'Trader 17', strategy:'Contre-Trend',  gx:7,  gy:8},
  {num:18, name:'Trader 18', strategy:'Trend 24h',     gx:10, gy:8},
  {num:19, name:'Trader 19', strategy:'Tight SL',      gx:13, gy:8},
  {num:20, name:'Trader 20', strategy:'Wide Range',    gx:16, gy:8},
  {num:21, name:'Trader 21', strategy:'Mid Risk',      gx:4,  gy:10},
  {num:22, name:'Trader 22', strategy:'Gold Ratio',    gx:7,  gy:10},
  {num:23, name:'Trader 23', strategy:'Breakout',      gx:10, gy:10},
  {num:24, name:'Trader 24', strategy:'Alt Season',    gx:13, gy:10},
  {num:25, name:'Trader 25', strategy:'Chaos',         gx:16, gy:10},
];

// strategy → color for trader figure
function strategyColor(s) {
  if (['Conservateur','Patience','Small Stake'].includes(s)) return '#4488FF';
  if (['Agressif','Short Only','Chaos'].includes(s))         return '#FF4444';
  if (['Scalper','Tight SL'].includes(s))                    return '#FF8800';
  if (['Mème Only'].includes(s))                             return '#44FF44';
  if (['Blue Chip','Gold Ratio'].includes(s))                return '#FFDD00';
  return '#AA44FF';
}

// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cw, ch;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  cw = canvas.width;
  ch = canvas.height;
}
window.addEventListener('resize', () => { resize(); });
resize();

// ─── ZOOM + PAN ───────────────────────────────────────────────────────────────
let scale = 1, panX = 0, panY = 0;
let dragging = false, dragX = 0, dragY = 0;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  scale *= factor;
  scale = Math.max(0.35, Math.min(3.5, scale));
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  dragging = true; dragX = e.clientX - panX; dragY = e.clientY - panY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (dragging) { panX = e.clientX - dragX; panY = e.clientY - dragY; }
});
window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });

// ─── DATA ─────────────────────────────────────────────────────────────────────
let apiData = {};
let tradersData = [];
let btcCandles = [];
let btcTF = '5m';
let tick = 0;

// agent states
const agentStates = {};
BASE_AGENTS.forEach(a => {
  agentStates[a.id] = { state: 'working', timer: 80 + Math.random() * 200 };
});

async function fetchAgents() {
  try {
    const r = await fetch('/api/agents');
    apiData = await r.json();
    updateHeader();
    updateLeftPanel();
  } catch(e) {}
}

async function fetchTraders() {
  try {
    const r = await fetch('/api/traders');
    tradersData = await r.json();
    updateLeaderboard();
  } catch(e) {}
}

async function fetchBTC() {
  try {
    const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${btcTF}&limit=60`);
    const raw = await r.json();
    btcCandles = raw.map(k => ({
      t: k[0], o: parseFloat(k[1]), h: parseFloat(k[2]),
      l: parseFloat(k[3]), c: parseFloat(k[4])
    }));
    const last = btcCandles[btcCandles.length - 1];
    if (last) {
      const el = document.getElementById('h-btc');
      el.textContent = '$' + last.c.toLocaleString('fr-FR', { maximumFractionDigits: 0 });
    }
  } catch(e) {}
}

// click zones
let clickZones = []; // { type, data, x, y, w, h }

// ─── HEADER UPDATE ────────────────────────────────────────────────────────────
function updateHeader() {
  const d = apiData;
  const balance = d.balance ?? d.portfolio?.balance ?? null;
  const pnl     = d.pnl     ?? d.portfolio?.pnl     ?? null;
  const wr      = d.win_rate ?? d.portfolio?.win_rate ?? null;

  const hb = document.getElementById('h-balance');
  const hp = document.getElementById('h-pnl');
  const hw = document.getElementById('h-wr');

  if (balance !== null) hb.textContent = balance.toFixed(2) + '€';
  if (pnl !== null) {
    hp.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + '€';
    hp.className = 'hv ' + (pnl >= 0 ? 'pos' : 'neg');
  }
  if (wr !== null) hw.textContent = (wr * 100).toFixed(1) + '%';
}

// ─── LEFT PANEL ───────────────────────────────────────────────────────────────
function updateLeftPanel() {
  const el = document.getElementById('agents-pills');
  el.innerHTML = '';
  BASE_AGENTS.forEach(a => {
    const info = apiData[a.id] || {};
    const status = info.status || 'ACTIF';
    const div = document.createElement('div');
    div.className = 'agent-pill';
    div.style.borderColor = a.color;
    div.innerHTML = `<span class="dot" style="background:${a.color}"></span>${a.name} — ${status}`;
    div.onclick = () => openAgentModal(a);
    el.appendChild(div);
  });
  document.getElementById('lp-status').textContent = `Agents: ${BASE_AGENTS.length} IA`;
}

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
function updateLeaderboard() {
  if (!tradersData.length) return;
  const sorted = [...tradersData].sort((a, b) => (b.pnl ?? 0) - (a.pnl ?? 0));
  const top5   = sorted.slice(0, 5);
  const bot3   = sorted.slice(-3).reverse();

  const lb = document.getElementById('leaderboard');
  lb.innerHTML = '';
  top5.forEach((t, i) => {
    const pnl = t.pnl ?? 0;
    const div = document.createElement('div');
    div.className = 'lb-row';
    div.innerHTML = `<span><span class="lb-rank">#${i+1}</span><span class="lb-name">${t.name ?? 'Trader '+t.num}</span></span><span class="lb-pnl ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}${pnl.toFixed(2)}€</span>`;
    div.onclick = () => openTraderModalByNum(t.num ?? t.id);
    lb.appendChild(div);
  });

  const ls = document.getElementById('losers');
  ls.innerHTML = '';
  bot3.forEach((t) => {
    const pnl = t.pnl ?? 0;
    const div = document.createElement('div');
    div.className = 'lb-row';
    div.innerHTML = `<span class="lb-name">${t.name ?? 'Trader '+t.num}</span><span class="lb-pnl neg">${pnl.toFixed(2)}€</span>`;
    div.onclick = () => openTraderModalByNum(t.num ?? t.id);
    ls.appendChild(div);
  });

  document.getElementById('rp-total').textContent = `${tradersData.length} traders actifs`;
}

// ─── DRAWING HELPERS ─────────────────────────────────────────────────────────

// Draw isometric box top face (flat rhombus)
function isoTop(p, tw, td, fill, strokeCol, glowCol, glowBlur) {
  // p = top-left corner in iso space
  // tw = tile width steps, td = tile depth steps
  const tl = p;
  const tr = { x: p.x + tw * TW/2, y: p.y + tw * TH/2 };
  const br = { x: p.x + (tw - td) * TW/2, y: p.y + (tw + td) * TH/2 };
  const bl = { x: p.x - td * TW/2, y: p.y + td * TH/2 };

  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y);
  ctx.lineTo(tr.x, tr.y);
  ctx.lineTo(br.x, br.y);
  ctx.lineTo(bl.x, bl.y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (glowCol) {
    ctx.save();
    ctx.shadowColor = glowCol;
    ctx.shadowBlur = glowBlur || 12;
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  return { tl, tr, br, bl };
}

// Draw iso box left face
function isoLeft(top_bl, top_br, height, fill, stroke) {
  const bl = { x: top_bl.x, y: top_bl.y + height };
  const br = { x: top_br.x, y: top_br.y + height };
  ctx.beginPath();
  ctx.moveTo(top_bl.x, top_bl.y);
  ctx.lineTo(top_br.x, top_br.y);
  ctx.lineTo(br.x, br.y);
  ctx.lineTo(bl.x, bl.y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

// Draw iso box right face
function isoRight(top_tr, top_br, height, fill, stroke) {
  const tr2 = { x: top_tr.x, y: top_tr.y + height };
  const br2 = { x: top_br.x, y: top_br.y + height };
  ctx.beginPath();
  ctx.moveTo(top_tr.x, top_tr.y);
  ctx.lineTo(top_br.x, top_br.y);
  ctx.lineTo(br2.x, br2.y);
  ctx.lineTo(tr2.x, tr2.y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

// ─── DRAW AGENT DESK ──────────────────────────────────────────────────────────
function drawAgentDesk(agent) {
  const p = iso(agent.gx, agent.gy, 0);
  const deskH = 14;
  const tw = 1.5, td = 1.2;

  // Desk box left/right faces
  const leftFill  = '#07001A';
  const rightFill = '#09001E';
  const face = isoTop(p, tw, td, '#0A0020', agent.color, agent.color, 18);

  // Left & right visible faces of the desk
  isoLeft(face.bl, face.br, deskH, leftFill, '#1A0030');
  isoRight(face.tr, face.br, deskH, rightFill, '#1A0030');

  // Monitor position: center of top face
  const mc = {
    x: (face.tl.x + face.br.x) / 2,
    y: (face.tl.y + face.br.y) / 2 - 20
  };

  // Monitor screen glow
  ctx.save();
  ctx.shadowColor = agent.color;
  ctx.shadowBlur = 10;
  ctx.fillStyle = agent.color + '22';
  ctx.strokeStyle = agent.color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(mc.x - 9, mc.y - 7, 18, 12);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Monitor stand
  ctx.strokeStyle = '#220033';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(mc.x, mc.y + 5);
  ctx.lineTo(mc.x, mc.y + 10);
  ctx.stroke();

  // Name tag pill (always visible)
  const tagY = face.tl.y - 38;
  ctx.save();
  ctx.font = 'bold 9px Courier New';
  const tw2 = ctx.measureText(agent.name).width + 10;
  ctx.fillStyle = '#0D0020';
  ctx.strokeStyle = agent.color;
  ctx.lineWidth = 1;
  roundRect(ctx, face.tl.x - tw2/2, tagY - 8, tw2, 13, 3);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = agent.color;
  ctx.textAlign = 'center';
  ctx.fillText(agent.name, face.tl.x, tagY);
  ctx.restore();

  // Store click zone for monitor
  agent._mz = { x: mc.x - 9, y: mc.y - 7, w: 18, h: 19 };
}

// ─── DRAW AGENT FIGURE ────────────────────────────────────────────────────────
function drawAgentFigure(agent) {
  const state  = agentStates[agent.id];
  const baseP  = iso(agent.gx, agent.gy, 0);
  // figure sits in front-left of desk
  const fx = baseP.x - TW * 0.5;
  const fy = baseP.y + TH * 0.4;

  const atDesk = state.state === 'working' || state.state === 'back';
  const atCoffee = state.state === 'at_coffee';
  const cfX = atCoffee ? fx - 40 + Math.sin(tick * 0.02) * 2 : fx;
  const cfY = atCoffee ? fy + 15 : fy;

  // Neon dot pulsing above head
  const pulse = 0.5 + 0.5 * Math.sin(tick * 0.07);
  ctx.save();
  ctx.shadowColor = agent.color;
  ctx.shadowBlur = 6 + pulse * 8;
  ctx.fillStyle = agent.color;
  ctx.beginPath();
  ctx.arc(cfX, cfY - 20, 3 + pulse * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Head
  ctx.save();
  ctx.shadowColor = agent.color + '88';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#FFCCAA';
  ctx.strokeStyle = agent.color;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(cfX, cfY - 7, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Torso
  ctx.fillStyle = agent.color + 'CC';
  ctx.strokeStyle = agent.color;
  ctx.lineWidth = 0.8;
  roundRect(ctx, cfX - 6, cfY, 12, 10, 2);
  ctx.fill();
  ctx.stroke();

  // Arms (working gesture)
  ctx.strokeStyle = agent.color + 'AA';
  ctx.lineWidth = 1.5;
  if (atDesk) {
    const armBob = Math.sin(tick * 0.12) * 2;
    ctx.beginPath();
    ctx.moveTo(cfX - 6, cfY + 2);
    ctx.lineTo(cfX - 11, cfY + 6 + armBob);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cfX + 6, cfY + 2);
    ctx.lineTo(cfX + 11, cfY + 6 - armBob);
    ctx.stroke();
  }
}

// ─── DRAW TRADER DESK ────────────────────────────────────────────────────────

// ─── DRAW BACK WALL SCREEN ───────────────────────────────────────────────────
const SC = {
  bl: iso(4,  0, 0.3), br: iso(18, 0, 0.3),
  tl: iso(4,  0, 4.0), tr: iso(18, 0, 4.0)
};

function drawBTCScreen() {
  // Screen quad
  ctx.beginPath();
  ctx.moveTo(SC.tl.x, SC.tl.y);
  ctx.lineTo(SC.tr.x, SC.tr.y);
  ctx.lineTo(SC.br.x, SC.br.y);
  ctx.lineTo(SC.bl.x, SC.bl.y);
  ctx.closePath();
  ctx.fillStyle = '#05001A';
  ctx.fill();
  ctx.strokeStyle = '#330066';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (!btcCandles.length) {
    ctx.fillStyle = '#553366';
    ctx.font = '11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('BTC/USDT — Chargement...', (SC.tl.x + SC.tr.x) / 2, (SC.tl.y + SC.bl.y) / 2);
    return;
  }

  // Clip to screen quad
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(SC.tl.x, SC.tl.y);
  ctx.lineTo(SC.tr.x, SC.tr.y);
  ctx.lineTo(SC.br.x, SC.br.y);
  ctx.lineTo(SC.bl.x, SC.bl.y);
  ctx.closePath();
  ctx.clip();

  // draw simplified candlesticks projected onto the screen quad
  const n    = btcCandles.length;
  const minP = Math.min(...btcCandles.map(c => c.l));
  const maxP = Math.max(...btcCandles.map(c => c.h));
  const range = maxP - minP || 1;

  const sl = SC.bl.x, sr = SC.br.x;
  const sb = SC.bl.y, st = SC.tl.y;
  const sw = sr - sl, sh = sb - st;

  btcCandles.forEach((c, i) => {
    const t  = i / n;
    const cx = sl + t * sw + (sw / n) * 0.5;
    const cw2 = Math.max(1, sw / n * 0.6);
    const oY = sb - ((c.o - minP) / range) * sh;
    const cY = sb - ((c.c - minP) / range) * sh;
    const hY = sb - ((c.h - minP) / range) * sh;
    const lY = sb - ((c.l - minP) / range) * sh;
    const bull = c.c >= c.o;
    const col = bull ? '#00C878' : '#FF2D78';

    // wick
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(cx, hY); ctx.lineTo(cx, lY);
    ctx.stroke();

    // body
    ctx.fillStyle = bull ? col + 'CC' : col + 'AA';
    ctx.fillRect(cx - cw2 / 2, Math.min(oY, cY), cw2, Math.max(1, Math.abs(cY - oY)));
  });

  // BTC price label
  const last = btcCandles[btcCandles.length - 1];
  ctx.fillStyle = '#00FFCC';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText('BTC $' + last.c.toLocaleString('en'), SC.tr.x - 4, SC.tr.y + 14);

  // Timeframe label
  ctx.fillStyle = '#AA44FF';
  ctx.font = '9px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('BTC/USDT ' + btcTF.toUpperCase(), SC.tl.x + 4, SC.tl.y + 13);

  ctx.restore();

  // Screen click zone
  SC._mz = {
    x: Math.min(SC.tl.x, SC.bl.x), y: SC.tl.y,
    w: Math.max(SC.tr.x, SC.br.x) - Math.min(SC.tl.x, SC.bl.x),
    h: SC.bl.y - SC.tl.y
  };

  // Timeframe buttons overlay (canvas space)
  const btnW = 24, btnH = 13, btnGap = 3;
  const tfs = ['1m','5m','15m','1h','4h','1d'];
  const bStartX = SC.tl.x + 4;
  const bStartY = SC.tl.y + 22;
  tfs.forEach((tf, i) => {
    const bx = bStartX + i * (btnW + btnGap);
    const by = bStartY;
    const active = tf === btcTF;
    ctx.fillStyle = active ? '#1A0030' : '#0D001A';
    ctx.strokeStyle = active ? '#AA44FF' : '#2A0045';
    ctx.lineWidth = 0.8;
    roundRect(ctx, bx, by, btnW, btnH, 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = active ? '#AA44FF' : '#553366';
    ctx.font = '7px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(tf.toUpperCase(), bx + btnW / 2, by + 9);
    // register click zone
    clickZones.push({ type: 'tf', tf, x: bx, y: by, w: btnW, h: btnH });
  });
}

// ─── FLOOR + WALLS ───────────────────────────────────────────────────────────
function drawFloor() {
  // Grid floor
  const gMin = 0, gMax = 18;
  for (let x = gMin; x < gMax; x++) {
    for (let y = gMin; y < 12; y++) {
      const p00 = iso(x,   y);
      const p10 = iso(x+1, y);
      const p11 = iso(x+1, y+1);
      const p01 = iso(x,   y+1);
      ctx.beginPath();
      ctx.moveTo(p00.x, p00.y);
      ctx.lineTo(p10.x, p10.y);
      ctx.lineTo(p11.x, p11.y);
      ctx.lineTo(p01.x, p01.y);
      ctx.closePath();
      const isLight = (x + y) % 2 === 0;
      ctx.fillStyle = isLight ? '#060010' : '#070014';
      ctx.fill();
      ctx.strokeStyle = '#0D0020';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }

  // Left wall
  for (let y = 0; y < 12; y++) {
    const p0 = iso(0, y,   0);
    const p1 = iso(0, y+1, 0);
    const p0h = iso(0, y,   3.5);
    const p1h = iso(0, y+1, 3.5);
    ctx.beginPath();
    ctx.moveTo(p0h.x, p0h.y);
    ctx.lineTo(p1h.x, p1h.y);
    ctx.lineTo(p1.x,  p1.y);
    ctx.lineTo(p0.x,  p0.y);
    ctx.closePath();
    ctx.fillStyle = '#07001A';
    ctx.fill();
    ctx.strokeStyle = '#110020';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

// ─── AGENT STATE MACHINE ─────────────────────────────────────────────────────
function updateAgentStates() {
  BASE_AGENTS.forEach(a => {
    const s = agentStates[a.id];
    s.timer -= 1;
    if (s.timer <= 0) {
      switch(s.state) {
        case 'working':
          if (Math.random() < 0.15) {
            s.state = 'to_coffee';
            s.timer = 40 + Math.random() * 30;
          } else {
            s.timer = 120 + Math.random() * 200;
          }
          break;
        case 'to_coffee':
          s.state = 'at_coffee';
          s.timer = 80 + Math.random() * 120;
          break;
        case 'at_coffee':
          s.state = 'back';
          s.timer = 40 + Math.random() * 30;
          break;
        case 'back':
          s.state = 'working';
          s.timer = 120 + Math.random() * 200;
          break;
      }
    }
  });
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render() {
  tick++;
  if (tick % 2 === 0) updateAgentStates();

  ctx.clearRect(0, 0, cw, ch);
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(scale, scale);

  // 1. Floor + walls
  drawFloor();

  // 2. Back wall screen
  drawBTCScreen();

  // 3. Build render list (painter's algorithm)
  const items = [];

  BASE_AGENTS.forEach(a => {
    items.push({ depth: a.gx + a.gy + 0.3, type: 'agentDesk',   data: a });
    items.push({ depth: a.gx + a.gy + 0.6, type: 'agentFigure', data: a });
  });

  TRADERS_GRID.forEach(t => {
    items.push({ depth: t.gx + t.gy + 0.3, type: 'traderDesk',   data: t });
    items.push({ depth: t.gx + t.gy + 0.6, type: 'traderFigure', data: t });
  });

  items.sort((a, b) => a.depth - b.depth);

  // 4. Draw items
  clickZones = [];

  items.forEach(item => {
    if (item.type === 'agentDesk') {
      drawAgentDesk(item.data);
      if (item.data._mz) clickZones.push({ type: 'agent', data: item.data, ...item.data._mz });
    } else if (item.type === 'agentFigure') {
      drawAgentFigure(item.data);
    } else if (item.type === 'traderDesk') {
      drawTraderDesk(item.data);
      if (item.data._mz) clickZones.push({ type: 'trader', data: item.data, ...item.data._mz });
    } else if (item.type === 'traderFigure') {
      drawTraderFigure(item.data);
    }
  });

  // 5. Screen click zone
  if (SC._mz) clickZones.push({ type: 'screen', ...SC._mz });

  ctx.restore();
  requestAnimationFrame(render);
}

// ─── CLICK HANDLER ───────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  if (dragging) return;
  const rect  = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rawX = (e.clientX - rect.left) * scaleX;
  const rawY = (e.clientY - rect.top)  * scaleY;
  // un-transform
  const cx2 = (rawX - panX) / scale;
  const cy2 = (rawY - panY) / scale;

  for (let i = clickZones.length - 1; i >= 0; i--) {
    const z = clickZones[i];
    if (cx2 >= z.x && cx2 <= z.x + z.w && cy2 >= z.y && cy2 <= z.y + z.h) {
      if (z.type === 'agent')  { openAgentModal(z.data);  return; }
      if (z.type === 'trader') { openTraderModal(z.data); return; }
      if (z.type === 'screen') { openDash(); return; }
      if (z.type === 'tf')     { btcTF = z.tf; fetchBTC(); return; }
    }
  }
});

// Tooltip on hover
canvas.addEventListener('mousemove', e => {
  const rect  = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rawX = (e.clientX - rect.left) * scaleX;
  const rawY = (e.clientY - rect.top)  * scaleY;
  const cx2 = (rawX - panX) / scale;
  const cy2 = (rawY - panY) / scale;

  const tip = document.getElementById('tooltip');
  let found = false;
  for (let i = clickZones.length - 1; i >= 0; i--) {
    const z = clickZones[i];
    if (cx2 >= z.x && cx2 <= z.x + z.w && cy2 >= z.y && cy2 <= z.y + z.h) {
      let txt = '';
      if (z.type === 'agent')  txt = z.data.name + ' — ' + z.data.role;
      if (z.type === 'trader') {
        const ld = tradersData.find(t => (t.num ?? t.id) === z.data.num) || {};
        const pnl = ld.pnl;
        txt = '#' + z.data.num + ' ' + z.data.strategy + (pnl !== undefined ? '  P&L: ' + (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + '€' : '');
      }
      if (z.type === 'screen') txt = 'Cliquer pour ouvrir le Dashboard';
      if (txt) {
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top  = (e.clientY + 8) + 'px';
        tip.textContent = txt;
        found = true;
      }
      break;
    }
  }
  if (!found) tip.style.display = 'none';
});
canvas.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.display = 'none'; });

    ['Balance',          ld.balance !== undefined ? ld.balance.toFixed(2)+'€' : '—',          ld.balance > 1000 ? 'pos' : ld.balance < 1000 ? 'neg' : ''],
    ['P&L',              pnl !== null ? (pnl>=0?'+':'')+pnl.toFixed(2)+'€' : '—',             pnl >= 0 ? 'pos' : 'neg'],
    ['Positions',        ld.open_positions ?? ld.positions?.length ?? '—',                     ''],
    ['Win Rate',         ld.win_rate !== undefined ? (ld.win_rate*100).toFixed(1)+'%' : '—',  ld.win_rate > 0.5 ? 'pos' : ld.win_rate < 0.5 ? 'neg' : ''],
    ['Stop-loss',        ld.stop_loss   !== undefined ? ld.stop_loss+'%'   : '—',              ''],
    ['Take-profit',      ld.take_profit !== undefined ? ld.take_profit+'%' : '—',              ''],
    ['Mise/trade',       ld.stake       !== undefined ? ld.stake+'€'       : '—',              ''],
    ['Total trades',     ld.total_trades ?? '—',                                               ''],
  ];
  cells.forEach(([lbl, val, cls]) => {
    const c = document.createElement('div');
    c.className = 'ts-cell';
    c.innerHTML = `<div class="ts-lbl">${lbl}</div><div class="ts-val ${cls}">${val}</div>`;
    stats.appendChild(c);
  });

  // Ranking
  const rank = document.getElementById('tm-rank');
  if (tradersData.length) {
    const sorted = [...tradersData].sort((a,b) => (b.pnl??0) - (a.pnl??0));
    const pos = sorted.findIndex(t => (t.num ?? t.id) === trader.num) + 1;
    rank.innerHTML = `<span style="color:#553366">Classement:</span> <span style="color:${tc};font-weight:bold">#${pos} / ${tradersData.length}</span>`;
  } else {
    rank.textContent = 'Classement: — / 25';
  }

  // Positions
  const posList = document.getElementById('tm-positions');
  posList.innerHTML = '';
  const positions = ld.positions || [];
  if (positions.length) {
    positions.forEach(p => {
      const pPnl = p.pnl ?? p.unrealized_pnl ?? 0;
      const div = document.createElement('div');
      div.className = 'pos-item';
      div.innerHTML = `
        <span class="pos-sym">${p.symbol ?? p.pair ?? '—'}</span>
        <span class="pos-side">${p.side ?? '—'}</span>
        <span class="pos-pnl ${pPnl>=0?'pos':'neg'}">${pPnl>=0?'+':''}${pPnl.toFixed(2)}€</span>
      `;
      posList.appendChild(div);
    });
  } else {
    const div = document.createElement('div');
    div.className = 'pos-item';
    div.style.color = '#330044';
    div.textContent = 'Aucune position ouverte';
    posList.appendChild(div);
  }

  document.getElementById('traderOverlay').classList.add('open');
}

function openTraderModalByNum(num) {
  const t = TRADERS_GRID.find(t => t.num === num);
  if (t) openTraderModal(t);
}

  const cells = [
    ['Balance',          balance !== null ? balance.toFixed(2)+'€' : '—',                    balance > 1000 ? 'pos' : balance < 1000 ? 'neg' : ''],
    ['P&L total',        pnl !== null ? (pnl>=0?'+':'')+pnl.toFixed(2)+'€' : '—',            pnl >= 0 ? 'pos' : 'neg'],
    ['Capital investi',  invested !== null ? invested.toFixed(2)+'€' : '—',                   ''],
    ['Win Rate',         wr !== null ? (wr*100).toFixed(1)+'%' : '—',                         wr > 0.5 ? 'pos' : wr < 0.5 ? 'neg' : ''],
    ['Total gains',      gains ? '+'+gains.toFixed(2)+'€' : '—',                              'pos'],
    ['Total pertes',     losses ? '-'+losses.toFixed(2)+'€' : '—',                            'neg'],
  ];

  const grid = document.getElementById('dash-grid');
  grid.innerHTML = '';
  cells.forEach(([lbl, val, cls]) => {
    const c = document.createElement('div');

    c.innerHTML = `<div class="info-lbl">${lbl}</div><div class="info-val ${cls}">${val}</div>`;
    grid.appendChild(c);
  });

  // Positions
  const posList = document.getElementById('dash-positions');
  posList.innerHTML = '';
  const positions = d.positions || d.open_positions || [];
  if (positions.length) {
    positions.forEach(p => {
      const pPnl = p.pnl ?? p.unrealized_pnl ?? 0;
      const div = document.createElement('div');
      div.className = 'pos-item';
      div.innerHTML = `
        <span class="pos-sym">${p.symbol ?? p.pair ?? '—'}</span>
        <span class="pos-side">${p.side ?? '—'}</span>
        <span class="pos-pnl ${pPnl>=0?'pos':'neg'}">${pPnl>=0?'+':''}${pPnl.toFixed(2)}€</span>

      posList.appendChild(div);
    });

    const div = document.createElement('div');

    div.style.color = '#330044';

    posList.appendChild(div);
  }

  // Recent trades terminal
  const trades = d.recent_trades || d.trades || [];
  const term = document.getElementById('dash-trades');
  term.innerHTML = '';
  if (trades.length) {
    trades.slice(-15).forEach(t => {

      div.textContent = `[${t.time ?? '—'}] ${t.symbol ?? '—'} ${t.side ?? ''} ${pnl2>=0?'+':''}${pnl2.toFixed ? pnl2.toFixed(2) : pnl2}€`;
      term.appendChild(div);
    });
  } else {
    term.innerHTML = '<span class="t-ok">Aucun trade récent</span>';
  }

  document.getElementById('dashOverlay').classList.add('open');
}

// ─── UTILITY ─────────────────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
