<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Floor — Bureau Isométrique</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #060810;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.header {
  width: 100%;
  padding: 10px 24px;
  background: #0d0f1a;
  border-bottom: 1px solid #1a2a3a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.logo { font-size: 14px; font-weight: bold; color: #4ecdc4; letter-spacing: 3px; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stat { text-align: center; }
.stat .lbl { font-size: 9px; color: #556; text-transform: uppercase; letter-spacing: 1px; }
.stat .val { font-size: 13px; font-weight: bold; color: #e0e0e0; }
.stat .val.pos { color: #4ecdc4; }
.stat .val.neg { color: #ff6b6b; }
.nav { display: flex; gap: 12px; align-items: center; }
.nav-btn {
  color: #45b7d1;
  text-decoration: none;
  font-size: 11px;
  padding: 4px 10px;
  border: 1px solid #1a3a4a;
  border-radius: 3px;
  background: none;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  transition: background 0.2s;
}
.nav-btn:hover { background: #1a3a4a; }
.canvas-wrap {
  margin: 10px auto;
  position: relative;
  cursor: default;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#hint {
  font-size: 9px;
  color: #334;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 1px;
}
/* MODALS */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #0d0f1a;
  border: 1px solid #1a3a4a;
  border-radius: 6px;
  padding: 24px;
  width: min(700px, 96vw);
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  font-family: 'Courier New', monospace;
}
.modal-close {
  position: absolute;
  top: 12px; right: 16px;
  background: none;
  border: none;
  color: #ff6b6b;
  font-size: 20px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
}
.modal-title {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #1a3a4a;
}
.agent-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}
.agent-color-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
}
.agent-badge {
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}
.badge-active { background: #0a2a1a; color: #4ecdc4; border: 1px solid #4ecdc4; }
.badge-coffee { background: #2a1a0a; color: #ffa500; border: 1px solid #ffa500; }
.badge-idle   { background: #1a1a2a; color: #778; border: 1px solid #334; }
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.info-row {
  background: #060810;
  padding: 8px 12px;
  border: 1px solid #1a2a3a;
  border-radius: 4px;
}
.info-row .lbl { font-size: 9px; color: #556; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
.info-row .val { font-size: 13px; font-weight: bold; }
.terminal {
  background: #020408;
  border: 1px solid #1a3a2a;
  border-radius: 4px;
  padding: 10px;
  font-size: 10px;
  color: #4ecdc4;
  min-height: 80px;
  max-height: 140px;
  overflow-y: auto;
  line-height: 1.6;
}
.terminal .ts { color: #334; }
.section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #556;
  margin: 16px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #1a2a3a;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">◈ TRADING FLOOR</div>
  <div class="stats">
    <div class="stat">
      <div class="lbl">Balance</div>
      <div class="val" id="hdr-balance">{{ balance | default('—') }}</div>
    </div>
    <div class="stat">
      <div class="lbl">P&amp;L</div>
      <div class="val" id="hdr-pnl">{{ pnl | default('—') }}</div>
    </div>
    <div class="stat">
      <div class="lbl">Positions</div>
      <div class="val" id="hdr-positions">{{ positions|length if positions else '—' }}</div>
    </div>
    <div class="stat">
      <div class="lbl">Win Rate</div>
      <div class="val" id="hdr-winrate">{{ win_rate | default('—') }}</div>
    </div>
  </div>
  <div class="nav">
    <button class="nav-btn" onclick="fetchData()">↻ Actualiser</button>
  </div>
</div>

<!-- HINT -->
<div id="hint">CLIQUEZ SUR UN MONITEUR POUR LES DÉTAILS AGENT · ÉCRAN TV → DASHBOARD</div>

<!-- CANVAS -->
<div class="canvas-wrap">
  <canvas id="c" width="1000" height="580"></canvas>
</div>

<!-- AGENT MODAL -->
<div class="modal-overlay" id="agent-modal">
  <div class="modal" id="agent-modal-box">
    <button class="modal-close" onclick="closeModals()">✕</button>
    <div class="modal-title" id="am-title">AGENT</div>
    <div class="agent-header">
      <div class="agent-color-dot" id="am-dot"></div>
      <div>
        <div style="font-size:14px;font-weight:bold;" id="am-name"></div>
        <div style="font-size:10px;color:#556;margin-top:2px;" id="am-role"></div>
      </div>
      <div id="am-badge" class="agent-badge badge-active">ACTIF</div>
    </div>
    <div class="info-grid" id="am-info"></div>
    <div class="section-title">TERMINAL</div>
    <div class="terminal" id="am-terminal"></div>
  </div>
</div>

<script>
(function(){
'use strict';

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const W = 1000, H = 580;
const TILE_W = 64, TILE_H = 32, WALL_H = 48;
const OX = 500, OY = 80;
const GRID_W = 16, GRID_H = 10;
const WALK_SPEED = 0.04;

function toScreen(gx, gy, gz) {
  gz = gz || 0;
  return {
    x: OX + (gx - gy) * TILE_W / 2,
    y: OY + (gx + gy) * TILE_H / 2 - gz * WALL_H
  };
}

// ─── AGENT DEFINITIONS ───────────────────────────────────────────────────────
// 6 desks: Row1 gx=3,gy=2 / gx=6,gy=2 / gx=9,gy=2
//          Row2 gx=3,gy=6 / gx=6,gy=6 / gx=9,gy=6
const AGENT_DEFS = [
  { id:'scanner',   name:'Scanner',   role:'Market Scanner',  shirtColor:'#4ECDC4', pants:'#2A3A4A', skin:'#F4C794', deskGx:3, deskGy:2 },
  { id:'analyste',  name:'Analyste',  role:'Data Analyst',    shirtColor:'#45B7D1', pants:'#1A2A3A', skin:'#C68642', deskGx:6, deskGy:2 },
  { id:'trader',    name:'★ Trader',  role:'Head Trader',     shirtColor:'#FFD700', pants:'#1A1A2A', skin:'#F4C794', deskGx:9, deskGy:2 },
  { id:'risk',      name:'Risk Mgr',  role:'Risk Manager',    shirtColor:'#FF6B6B', pants:'#2A1A1A', skin:'#C68642', deskGx:3, deskGy:6 },
  { id:'portfolio', name:'Portfolio', role:'Portfolio Mgr',   shirtColor:'#98E8C0', pants:'#1A2A1A', skin:'#F4C794', deskGx:6, deskGy:6 },
  { id:'reporter',  name:'Reporter',  role:'Report Analyst',  shirtColor:'#C3A0E8', pants:'#2A1A3A', skin:'#C68642', deskGx:9, deskGy:6 }
];

// Destination positions
const COFFEE_POS = { gx: 14.0, gy: 5.0 };
const WATER_POS  = { gx: 1.2,  gy: 5.0 };

// ─── STATE ───────────────────────────────────────────────────────────────────
let apiData = null;
let marketQuiet = false;
let t = 0;
let tvZone = { x: 0, y: 0, w: 0, h: 0 };

const chars = AGENT_DEFS.map((def, idx) => ({
  ...def,
  state: 'working',
  cx: def.deskGx,
  cy: def.deskGy,
  tx: def.deskGx,
  ty: def.deskGy,
  breakTimer: 0,
  breakCooldown: 400 + idx * 120 + Math.floor(Math.random() * 200),
  destination: 'coffee',
  _mz: null,
  liveData: null
}));

// ─── CANVAS ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ─── ISO PRIMITIVES ──────────────────────────────────────────────────────────
function isoTile(p, fillTop, fillLeft, fillRight, tileDepth) {
  // tileDepth: pixel height of the side faces (floor edge)
  const hw = TILE_W / 2, hh = TILE_H / 2;
  // Top face
  ctx.beginPath();
  ctx.moveTo(p.x,      p.y - hh);
  ctx.lineTo(p.x + hw, p.y);
  ctx.lineTo(p.x,      p.y + hh);
  ctx.lineTo(p.x - hw, p.y);
  ctx.closePath();
  ctx.fillStyle = fillTop;
  ctx.fill();
  if (tileDepth > 0) {
    // Left side face
    ctx.beginPath();
    ctx.moveTo(p.x - hw, p.y);
    ctx.lineTo(p.x,      p.y + hh);
    ctx.lineTo(p.x,      p.y + hh + tileDepth);
    ctx.lineTo(p.x - hw, p.y + tileDepth);
    ctx.closePath();
    ctx.fillStyle = fillLeft;
    ctx.fill();
    // Right side face
    ctx.beginPath();
    ctx.moveTo(p.x,      p.y + hh);
    ctx.lineTo(p.x + hw, p.y);
    ctx.lineTo(p.x + hw, p.y + tileDepth);
    ctx.lineTo(p.x,      p.y + hh + tileDepth);
    ctx.closePath();
    ctx.fillStyle = fillRight;
    ctx.fill();
  }
}

// Generic isometric box: top face centered at (cx,cy) in screen space
// tw = width in tiles, td = depth in tiles, h = pixel height
function isoBox(cx, cy, tw, td, h, topColor, leftColor, rightColor, outlineColor) {
  const hw = tw * TILE_W / 2;
  const hd = td * TILE_H / 2;
  // Top face
  ctx.beginPath();
  ctx.moveTo(cx,      cy - hd);
  ctx.lineTo(cx + hw, cy);
  ctx.lineTo(cx,      cy + hd);
  ctx.lineTo(cx - hw, cy);
  ctx.closePath();
  ctx.fillStyle = topColor;
  ctx.fill();
  if (outlineColor) { ctx.strokeStyle = outlineColor; ctx.lineWidth = 0.5; ctx.stroke(); }
  if (h > 0) {
    // Left face
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy);
    ctx.lineTo(cx,      cy + hd);
    ctx.lineTo(cx,      cy + hd + h);
    ctx.lineTo(cx - hw, cy + h);
    ctx.closePath();
    ctx.fillStyle = leftColor;
    ctx.fill();
    if (outlineColor) { ctx.strokeStyle = outlineColor; ctx.lineWidth = 0.5; ctx.stroke(); }
    // Right face
    ctx.beginPath();
    ctx.moveTo(cx,      cy + hd);
    ctx.lineTo(cx + hw, cy);
    ctx.lineTo(cx + hw, cy + h);
    ctx.lineTo(cx,      cy + hd + h);
    ctx.closePath();
    ctx.fillStyle = rightColor;
    ctx.fill();
    if (outlineColor) { ctx.strokeStyle = outlineColor; ctx.lineWidth = 0.5; ctx.stroke(); }
  }
}

// ─── FLOOR ───────────────────────────────────────────────────────────────────
function drawFloor() {
  const tiles = [];
  for (let gy = 1; gy <= GRID_H; gy++) {
    for (let gx = 1; gx <= GRID_W; gx++) {
      tiles.push({ gx, gy, _d: gx + gy });
    }
  }
  tiles.sort((a, b) => a._d - b._d);
  tiles.forEach(({ gx, gy }) => {
    const p = toScreen(gx, gy);
    const even = (gx + gy) % 2 === 0;
    const top   = even ? '#C4A882' : '#B89A74';
    const left  = even ? '#9A7A54' : '#8E7050';
    const right = even ? '#AA8860' : '#9C7E58';
    isoTile(p, top, left, right, 3);
  });
}

// ─── WALLS ───────────────────────────────────────────────────────────────────
function drawWalls() {
  // Back wall gy=0, from gx=0 to gx=GRID_W
  // We draw wall slabs: the visible face is the +y face of each slab
  for (let gx = 0; gx <= GRID_W; gx++) {
    const p  = toScreen(gx,     1);  // floor tile at gy=1
    const p0 = toScreen(gx,     0);  // wall base gy=0
    // Wall slab front face (+y direction = viewer side)
    // Top points: wall top, bottom points: floor level
    const wallTop1x = OX + (gx     - 0) * TILE_W / 2;
    const wallTop1y = OY + (gx     + 0) * TILE_H / 2 - WALL_H;
    const wallTop2x = OX + ((gx+1) - 0) * TILE_W / 2;
    const wallTop2y = OY + ((gx+1) + 0) * TILE_H / 2 - WALL_H;
    const wallBot1x = wallTop1x;
    const wallBot1y = wallTop1y + WALL_H;
    const wallBot2x = wallTop2x;
    const wallBot2y = wallTop2y + WALL_H;

    // Front face of back wall (the angled slab face visible to viewer)
    ctx.beginPath();
    ctx.moveTo(wallTop1x, wallTop1y);
    ctx.lineTo(wallTop2x, wallTop2y);
    ctx.lineTo(wallBot2x, wallBot2y);
    ctx.lineTo(wallBot1x, wallBot1y);
    ctx.closePath();
    ctx.fillStyle = '#2A2A35';
    ctx.fill();
    ctx.strokeStyle = '#1a1a28';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Top cap
    ctx.beginPath();
    ctx.moveTo(wallTop1x,            wallTop1y);
    ctx.lineTo(wallTop2x,            wallTop2y);
    ctx.lineTo(wallTop2x - TILE_W/2, wallTop2y + TILE_H/2);
    ctx.lineTo(wallTop1x - TILE_W/2, wallTop1y + TILE_H/2);
    ctx.closePath();
    ctx.fillStyle = '#3a3a48';
    ctx.fill();

    // Stone texture lines
    if (gx < GRID_W) {
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 0.5;
      for (let row = 0; row < 3; row++) {
        const fy = wallTop1y + (WALL_H / 3) * (row + 1);
        const fy2 = wallTop2y + (WALL_H / 3) * (row + 1);
        ctx.beginPath();
        ctx.moveTo(wallTop1x, fy);
        ctx.lineTo(wallTop2x, fy2);
        ctx.stroke();
      }
    }
  }

  // Left wall gx=0, from gy=0 to gy=GRID_H
  for (let gy = 0; gy <= GRID_H; gy++) {
    const wallTop1x = OX + (0 - gy    ) * TILE_W / 2;
    const wallTop1y = OY + (0 + gy    ) * TILE_H / 2 - WALL_H;
    const wallTop2x = OX + (0 - (gy+1)) * TILE_W / 2;
    const wallTop2y = OY + (0 + (gy+1)) * TILE_H / 2 - WALL_H;

    // Left face of left wall (facing +x direction)
    ctx.beginPath();
    ctx.moveTo(wallTop1x,            wallTop1y);
    ctx.lineTo(wallTop1x + TILE_W/2, wallTop1y + TILE_H/2);
    ctx.lineTo(wallTop1x + TILE_W/2, wallTop1y + TILE_H/2 + WALL_H);
    ctx.lineTo(wallTop1x,            wallTop1y + WALL_H);
    ctx.closePath();
    ctx.fillStyle = '#252530';
    ctx.fill();
    ctx.strokeStyle = '#1a1a28';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Top cap
    ctx.beginPath();
    ctx.moveTo(wallTop1x,            wallTop1y);
    ctx.lineTo(wallTop1x + TILE_W/2, wallTop1y + TILE_H/2);
    ctx.lineTo(wallTop2x + TILE_W/2, wallTop2y + TILE_H/2);
    ctx.lineTo(wallTop2x,            wallTop2y);
    ctx.closePath();
    ctx.fillStyle = '#353545';
    ctx.fill();

    // Stone texture
    if (gy < GRID_H) {
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 0.5;
      for (let row = 0; row < 3; row++) {
        const fy1 = wallTop1y + (WALL_H / 3) * (row + 1);
        const fy2 = wallTop1y + TILE_H/2 + (WALL_H / 3) * (row + 1);
        ctx.beginPath();
        ctx.moveTo(wallTop1x,            fy1);
        ctx.lineTo(wallTop1x + TILE_W/2, fy2);
        ctx.stroke();
      }
    }
  }

  // Neon accent strip along base of back wall
  const glowAlpha = 0.5 + 0.3 * Math.sin(t * 0.03);
  for (let gx = 1; gx < GRID_W; gx++) {
    const x1 = OX + (gx     - 0) * TILE_W / 2;
    const x2 = OX + ((gx+1) - 0) * TILE_W / 2;
    const y1 = OY + (gx     + 0) * TILE_H / 2 - 2;
    const y2 = OY + ((gx+1) + 0) * TILE_H / 2 - 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x2, y2 + 2);
    ctx.lineTo(x1, y1 + 2);
    ctx.closePath();
    ctx.fillStyle = `rgba(78,205,196,${glowAlpha * 0.35})`;
    ctx.fill();
  }
}

// ─── TV SCREEN ───────────────────────────────────────────────────────────────
function drawTVScreen() {
  // Mounted on back wall (gy=0), gx=4 to gx=12
  // The back wall front face runs along gx direction at gy=0
  // Points on the wall face: for a given gx at gy=0, the right-facing wall surface
  // x = OX + gx*TILE_W/2, y goes from (OY + gx*TILE_H/2 - WALL_H) to (OY + gx*TILE_H/2)

  const gxL = 4, gxR = 12;
  const x1 = OX + gxL * TILE_W / 2;
  const y1 = OY + gxL * TILE_H / 2 - WALL_H;
  const x2 = OX + gxR * TILE_W / 2;
  const y2 = OY + gxR * TILE_H / 2 - WALL_H;

  const screenH = 90;
  const marginT = 5;
  const frameW  = 4;

  // Corners of the screen (parallelogram on the wall face)
  const tlx = x1, tly = y1 + marginT;
  const trx = x2, try_ = y2 + marginT;
  const blx = x1, bly = y1 + marginT + screenH;
  const brx = x2, bry = y2 + marginT + screenH;

  // Black frame
  ctx.beginPath();
  ctx.moveTo(tlx - frameW, tly - frameW);
  ctx.lineTo(trx + frameW, try_ - frameW);
  ctx.lineTo(brx + frameW, bry + frameW);
  ctx.lineTo(blx - frameW, bly + frameW);
  ctx.closePath();
  ctx.fillStyle = '#0a0a12';
  ctx.fill();
  ctx.strokeStyle = '#4ecdc4';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Screen surface
  ctx.beginPath();
  ctx.moveTo(tlx, tly);
  ctx.lineTo(trx, try_);
  ctx.lineTo(brx, bry);
  ctx.lineTo(blx, bly);
  ctx.closePath();
  ctx.fillStyle = '#030814';
  ctx.fill();

  // Screen glow
  const g = ctx.createLinearGradient(tlx, tly, trx, bry);
  g.addColorStop(0,   'rgba(78,205,196,0.08)');
  g.addColorStop(0.5, 'rgba(69,183,209,0.04)');
  g.addColorStop(1,   'rgba(78,205,196,0.08)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(tlx, tly); ctx.lineTo(trx, try_);
  ctx.lineTo(brx, bry); ctx.lineTo(blx, bly);
  ctx.closePath();
  ctx.fill();

  // Scanlines clip
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tlx, tly); ctx.lineTo(trx, try_);
  ctx.lineTo(brx, bry); ctx.lineTo(blx, bly);
  ctx.closePath();
  ctx.clip();
  const screenW = x2 - x1;
  for (let scanY = tly; scanY < bly + screenH; scanY += 3) {
    const ratio = (scanY - tly) / screenH;
    const lx = tlx + (blx - tlx) * ratio;
    ctx.beginPath();
    ctx.moveTo(lx,            scanY);
    ctx.lineTo(lx + screenW,  scanY + (try_ - tly));
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();

  // Draw text on screen with isometric shear transform
  const stats = apiData ? apiData._stats : null;
  const balance   = stats ? (stats.balance   || '—') : '{{ balance }}';
  const pnl       = stats ? (stats.pnl       || '—') : '{{ pnl }}';
  const positions = stats ? (stats.positions || '—') : '{{ positions|length }}';
  const winRate   = stats ? (stats.win_rate  || '—') : '{{ win_rate }}';

  ctx.save();
  // Shear transform: the wall face is a parallelogram slanted down-right
  // slope = (try_ - tly) / (trx - tlx)
  const slope = (try_ - tly) / (trx - tlx);
  // Apply transform: y' = y + slope*(x - tlx) + tly  → use ctx.transform
  ctx.transform(1, slope, 0, 1, 0, tly - slope * tlx);

  const sx = tlx, sw = trx - tlx;

  // Title bar
  ctx.fillStyle = 'rgba(78,205,196,0.14)';
  ctx.fillRect(sx, 0, sw, 16);
  ctx.fillStyle = '#4ecdc4';
  ctx.font = 'bold 8px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('◈  TRADING FLOOR', sx + sw / 2, 11);

  // Divider
  ctx.strokeStyle = 'rgba(78,205,196,0.3)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(sx + 6, 18); ctx.lineTo(sx + sw - 6, 18);
  ctx.stroke();

  const labels = ['BALANCE', 'P&L', 'POSITIONS', 'WIN RATE'];
  const values = [balance, pnl, String(positions), winRate];
  const vColors = [
    '#e0e0e0',
    String(pnl).startsWith('-') ? '#ff6b6b' : '#4ecdc4',
    '#45b7d1',
    '#98e8c0'
  ];
  const rowH = (screenH - 22) / 4;
  labels.forEach((lbl, i) => {
    const rowY = 22 + i * rowH;
    ctx.fillStyle = '#445566';
    ctx.font = '6px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(lbl, sx + sw / 2, rowY + 6);
    ctx.fillStyle = vColors[i];
    ctx.font = 'bold 9px Courier New';
    ctx.fillText(String(values[i]), sx + sw / 2, rowY + 17);
    if (i < 3) {
      ctx.strokeStyle = 'rgba(78,205,196,0.12)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(sx + 8, rowY + 21); ctx.lineTo(sx + sw - 8, rowY + 21);
      ctx.stroke();
    }
  });

  // "CLICK" hint
  const pulseA = 0.5 + 0.5 * Math.sin(t * 0.06);
  ctx.globalAlpha = pulseA;
  ctx.fillStyle = '#4ecdc4';
  ctx.font = '7px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('▶ DASHBOARD', sx + 4, screenH - 2);
  ctx.globalAlpha = 1;

  ctx.restore();

  // Store TV click zone
  tvZone.x = tlx - frameW;
  tvZone.y = Math.min(tly, try_) - frameW;
  tvZone.w = (trx - tlx) + frameW * 2;
  tvZone.h = screenH + frameW * 2 + Math.abs(try_ - tly);
}

// ─── DESK (BLACK) ────────────────────────────────────────────────────────────
function drawDesk(agent) {
  const p = toScreen(agent.deskGx, agent.deskGy);
  const dw = 2.0, dd = 1.4, dh = 14;

  // Desk surface centered at p, top face at height dh above floor
  const cx = p.x, cy = p.y - dh;
  isoBox(cx, cy, dw, dd, dh, '#1A1A1A', '#111111', '#0D0D0D', '#2a2a2a');

  // Chair between character and desk (slightly in front of desk)
  const chairP = toScreen(agent.deskGx, agent.deskGy + 0.7);
  const chCx = chairP.x, chCy = chairP.y - 10;
  // Chair seat
  isoBox(chCx, chCy, 0.55, 0.55, 8, '#1A1A1A', '#111111', '#0D0D0D', '#2a2a2a');
  // Chair back (thin rectangle upward)
  ctx.fillStyle = '#181818';
  ctx.fillRect(chCx - 14, chCy - 22, 28, 14);
  ctx.fillStyle = '#222222';
  ctx.fillRect(chCx - 13, chCy - 21, 26, 12);

  // Monitor on desk
  const mX = p.x;
  const mY = p.y - dh - 20;
  const mW = 22, mH = 16;
  const isWorking = agent.state === 'working';
  const agentColor = agent.shirtColor;

  // Monitor stand
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(mX - 2, mY + mH, 4, 7);
  ctx.fillStyle = '#222';
  ctx.fillRect(mX - 6, mY + mH + 6, 12, 2);

  // Monitor frame
  ctx.fillStyle = '#222222';
  ctx.fillRect(mX - mW / 2 - 2, mY - 2, mW + 4, mH + 4);

  // Monitor screen
  if (isWorking) {
    const gAlpha = 0.25 + 0.15 * Math.sin(t * 0.07 + agent.deskGx * 0.7);
    ctx.shadowColor = agentColor;
    ctx.shadowBlur = 6 + gAlpha * 4;
  }
  ctx.fillStyle = isWorking ? '#0a1520' : '#080810';
  ctx.fillRect(mX - mW / 2, mY, mW, mH);
  ctx.shadowBlur = 0;

  // Screen content lines
  if (isWorking) {
    const lc = [agentColor, '#45b7d1', '#98e8c0'];
    for (let ln = 0; ln < 3; ln++) {
      ctx.fillStyle = lc[ln % 3];
      const lw = 8 + (ln === 0 ? 10 : 6) + Math.floor(((t + agent.deskGx * 7 + ln * 13) % 7));
      ctx.fillRect(mX - mW / 2 + 2, mY + 2 + ln * 4, Math.min(lw, mW - 4), 2);
    }
  }

  // Store monitor click zone
  agent._mz = { x: mX - mW / 2 - 2, y: mY - 2, w: mW + 4, h: mH + 4 };

  // Name tag
  ctx.font = 'bold 7px Courier New';
  ctx.textAlign = 'center';
  ctx.fillStyle = agentColor;
  ctx.fillText(agent.name, mX, mY - 6);
}

// ─── HUMAN CHARACTER ─────────────────────────────────────────────────────────
function drawChar(char) {
  const sx = OX + (char.cx - char.cy) * TILE_W / 2;
  const sy = OY + (char.cx + char.cy) * TILE_H / 2;

  const walking = (char.state === 'to_coffee' || char.state === 'to_water' || char.state === 'back');
  const legSwing = walking ? Math.sin(t * 0.18) * 5 : 0;
  const atBreak  = (char.state === 'at_coffee' || char.state === 'at_water');
  const working  = (char.state === 'working');

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(sx, sy + 20, 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const px = char.pants;
  const sk = char.skin;
  const sh = char.shirtColor;

  // LEGS
  if (working) {
    // Arms stretched forward (working posture — arms out on desk)
    // Left leg
    ctx.fillStyle = px;
    ctx.fillRect(sx - 5, sy + 8, 4, 10);
    // Right leg
    ctx.fillStyle = px;
    ctx.fillRect(sx + 1, sy + 8, 4, 10);
    // Shoes
    ctx.fillStyle = '#1a1010';
    ctx.fillRect(sx - 6, sy + 17, 5, 3);
    ctx.fillRect(sx + 1, sy + 17, 5, 3);
  } else {
    // Left leg
    ctx.fillStyle = px;
    ctx.fillRect(sx - 5, sy + 8 + legSwing, 4, 9);
    // Right leg
    ctx.fillStyle = px;
    ctx.fillRect(sx + 1, sy + 8 - legSwing, 4, 9);
    // Shoes
    ctx.fillStyle = '#1a1010';
    ctx.fillRect(sx - 6, sy + 16 + legSwing, 5, 3);
    ctx.fillRect(sx + 1, sy + 16 - legSwing, 5, 3);
  }

  // TORSO
  ctx.fillStyle = sh;
  ctx.fillRect(sx - 6, sy - 2, 12, 11);
  // Torso shadow side
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(sx - 6, sy - 2, 4, 11);
  // Collar
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(sx - 1, sy - 2, 2, 4);

  // ARMS
  if (working) {
    // Arms stretched forward/down onto desk
    ctx.fillStyle = sh;
    ctx.fillRect(sx - 10, sy, 4, 9);
    ctx.fillRect(sx + 6,  sy, 4, 9);
    // Hands on desk
    ctx.fillStyle = sk;
    ctx.fillRect(sx - 10, sy + 8, 4, 3);
    ctx.fillRect(sx + 6,  sy + 8, 4, 3);
  } else if (atBreak) {
    // Arms raised holding cup/bottle
    ctx.fillStyle = sh;
    ctx.fillRect(sx - 10, sy - 4, 4, 7);
    ctx.fillRect(sx + 6,  sy - 4, 4, 7);
    // Hands
    ctx.fillStyle = sk;
    ctx.fillRect(sx - 10, sy + 2, 4, 3);
    ctx.fillRect(sx + 6,  sy + 2, 4, 3);
  } else {
    // Normal arms
    ctx.fillStyle = sh;
    ctx.fillRect(sx - 10, sy, 4, 8);
    ctx.fillRect(sx + 6,  sy, 4, 8);
    // Hands
    ctx.fillStyle = sk;
    ctx.fillRect(sx - 10, sy + 7, 4, 3);
    ctx.fillRect(sx + 6,  sy + 7, 4, 3);
  }

  // HEAD
  ctx.fillStyle = sk;
  ctx.beginPath();
  ctx.ellipse(sx, sy - 9, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Head shading side
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.ellipse(sx - 2, sy - 9, 2, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = (sk === '#C68642') ? '#2a1a0a' : '#3a2a1a';
  ctx.fillRect(sx - 5, sy - 16, 10, 5);
  ctx.beginPath();
  ctx.arc(sx, sy - 14, 5, Math.PI, 0);
  ctx.fill();

  // EYES
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(sx - 3, sy - 12, 2, 2);
  ctx.fillRect(sx + 1, sy - 12, 2, 2);
  // Eye shine
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(sx - 3, sy - 12, 1, 1);
  ctx.fillRect(sx + 1, sy - 12, 1, 1);

  // MOUTH
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(sx - 2, sy - 7, 4, 1);

  // ACCESSORY: cup when at coffee, bottle when at water
  if (char.state === 'at_coffee') {
    // Coffee cup
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(sx + 8, sy - 6, 5, 7);
    ctx.fillStyle = '#5c4010';
    ctx.fillRect(sx + 9, sy - 5, 3, 5);
    ctx.fillStyle = '#c86010';
    ctx.fillRect(sx + 9, sy - 5, 3, 2);
    // Steam
    const sa = 0.4 + 0.5 * Math.sin(t * 0.12);
    ctx.save(); ctx.globalAlpha = sa;
    ctx.fillStyle = '#ddd';
    ctx.fillRect(sx + 10, sy - 10, 1, 3);
    ctx.fillRect(sx + 12, sy - 12, 1, 4);
    ctx.restore();
  } else if (char.state === 'at_water') {
    // Water bottle
    ctx.fillStyle = '#4090c0';
    ctx.fillRect(sx + 8, sy - 8, 5, 10);
    ctx.fillStyle = '#60b0e0';
    ctx.fillRect(sx + 9, sy - 7, 3, 3);
    ctx.fillStyle = '#2a7aaa';
    ctx.fillRect(sx + 8, sy - 9, 5, 2);
  }
}

// ─── COFFEE MACHINE ──────────────────────────────────────────────────────────
function drawCoffeeMachine(gx, gy) {
  const p = toScreen(gx, gy);
  const bH = 6, mH = 30;

  // Counter base
  isoBox(p.x, p.y - bH, 1.2, 0.9, bH, '#2a3040', '#1e2438', '#222c3e', '#1a2030');

  // Machine body
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(p.x - 14, p.y - bH - mH, 28, mH);
  // Front panel
  ctx.fillStyle = '#242434';
  ctx.fillRect(p.x - 12, p.y - bH - mH + 2, 24, mH - 4);
  // Brand stripe
  ctx.fillStyle = '#4a3010';
  ctx.fillRect(p.x - 12, p.y - bH - mH + 5, 24, 5);
  ctx.fillStyle = '#8B6914';
  ctx.font = 'bold 4px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('BREW', p.x, p.y - bH - mH + 9);
  // Display screen
  ctx.fillStyle = '#0a120a';
  ctx.fillRect(p.x - 9, p.y - bH - mH + 12, 18, 9);
  const dispA = 0.6 + 0.4 * Math.sin(t * 0.05);
  ctx.fillStyle = `rgba(78,205,196,${dispA})`;
  ctx.font = '4px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('READY', p.x, p.y - bH - mH + 19);
  // Buttons
  ctx.fillStyle = '#4ecdc4';
  ctx.beginPath(); ctx.arc(p.x - 6, p.y - bH - mH + 24, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#45b7d1';
  ctx.beginPath(); ctx.arc(p.x,     p.y - bH - mH + 24, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(p.x + 6, p.y - bH - mH + 24, 2, 0, Math.PI*2); ctx.fill();
  // Spout
  ctx.fillStyle = '#555';
  ctx.fillRect(p.x - 2, p.y - bH - 12, 4, 12);
  // Cup tray
  ctx.fillStyle = '#444';
  ctx.fillRect(p.x - 9, p.y - bH - 2, 18, 3);
  // Label
  ctx.fillStyle = '#8B6914';
  ctx.font = '6px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('COFFEE', p.x, p.y - bH - mH - 4);
}

// ─── WATER FOUNTAIN ──────────────────────────────────────────────────────────
function drawWaterFountain(gx, gy) {
  const p = toScreen(gx, gy);
  const bH = 6, fH = 32;

  // Base
  isoBox(p.x, p.y - bH, 0.9, 0.9, bH, '#1a2838', '#142030', '#18283a', '#1a2a3a');

  // Bottle (large cylinder)
  ctx.fillStyle = '#3070a0';
  ctx.fillRect(p.x - 7, p.y - bH - fH, 14, fH);
  // Bottle highlight
  ctx.fillStyle = '#60a0d0';
  ctx.fillRect(p.x - 5, p.y - bH - fH + 2, 4, fH - 4);
  // Bottle top cap
  ctx.fillStyle = '#205080';
  ctx.fillRect(p.x - 6, p.y - bH - fH, 12, 4);
  // Water level (slightly blue inside)
  ctx.fillStyle = 'rgba(100,180,240,0.3)';
  ctx.fillRect(p.x - 6, p.y - bH - fH/2, 12, fH/2);
  // Dispenser body
  ctx.fillStyle = '#d0d8e0';
  ctx.fillRect(p.x - 9, p.y - bH - 12, 18, 12);
  ctx.fillStyle = '#b0bcc8';
  ctx.fillRect(p.x - 8, p.y - bH - 11, 16, 10);
  // Tap
  ctx.fillStyle = '#4090c0';
  ctx.fillRect(p.x - 3, p.y - bH - 5, 6, 5);
  // Water drip animation
  const drip = ((t * 2) % 30);
  if (drip < 15) {
    ctx.fillStyle = 'rgba(100,180,240,0.6)';
    ctx.fillRect(p.x - 1, p.y - bH - 1 + drip / 3, 2, 2);
  }
  // Label
  ctx.fillStyle = '#60a0d0';
  ctx.font = '6px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('WATER', p.x, p.y - bH - fH - 4);
}

// ─── PLANT ───────────────────────────────────────────────────────────────────
function drawPlant(gx, gy) {
  const p = toScreen(gx, gy);
  const potH = 14;
  const sway = Math.sin(t * 0.025 + gx) * 1.5;

  // Pot
  ctx.fillStyle = '#7B4010';
  ctx.fillRect(p.x - 8, p.y - potH, 16, potH);
  ctx.fillStyle = '#9B5010';
  ctx.fillRect(p.x - 9, p.y - potH, 18, 3);
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(p.x - 7, p.y - potH + 3, 14, 4);

  // Stem
  ctx.fillStyle = '#0d5020';
  ctx.fillRect(p.x - 1, p.y - potH - 20, 2, 20);

  // Leaves
  const leaves = [
    { dx: -10 + sway, dy: -30, rx: 7, ry: 5, color: '#1a6e30', angle: 0.4 },
    { dx:   6 + sway, dy: -34, rx: 6, ry: 4, color: '#20843a', angle: -0.3 },
    { dx:  -4 + sway, dy: -40, rx: 7, ry: 5, color: '#157028', angle: 0.1 },
    { dx:   3 + sway, dy: -26, rx: 5, ry: 4, color: '#1a7a2c', angle: -0.5 },
    { dx:  -7 + sway, dy: -22, rx: 4, ry: 3, color: '#12602a', angle: 0.6 },
  ];
  leaves.forEach(l => {
    ctx.save();
    ctx.translate(p.x + l.dx, p.y + l.dy);
    ctx.rotate(l.angle + sway * 0.02);
    ctx.fillStyle = l.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, l.rx, l.ry, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    // Leaf vein
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(0, -l.ry); ctx.lineTo(0, l.ry);
    ctx.stroke();
    ctx.restore();
  });
}

// ─── OVERHEAD LIGHTS ─────────────────────────────────────────────────────────
function drawOverheadLights() {
  const lightGx = [4, 8, 12, 4, 8, 12];
  const lightGy = [3, 3, 3,  7, 7, 7 ];
  for (let i = 0; i < lightGx.length; i++) {
    const lp = toScreen(lightGx[i], lightGy[i]);
    const rad = ctx.createRadialGradient(lp.x, lp.y - 35, 0, lp.x, lp.y - 35, 65);
    rad.addColorStop(0, 'rgba(255,255,200,0.05)');
    rad.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = rad;
    ctx.beginPath();
    ctx.arc(lp.x, lp.y - 35, 65, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─── STATE MACHINE ───────────────────────────────────────────────────────────
function updateChars() {
  chars.forEach((char, i) => {
    switch (char.state) {
      case 'working':
        char.cx = char.deskGx;
        char.cy = char.deskGy;
        char.breakCooldown--;
        if (char.breakCooldown <= 0 && marketQuiet) {
          // Pick coffee or water randomly
          char.destination = Math.random() < 0.6 ? 'coffee' : 'water';
          const dest = char.destination === 'coffee' ? COFFEE_POS : WATER_POS;
          char.tx = dest.gx;
          char.ty = dest.gy;
          char.state = char.destination === 'coffee' ? 'to_coffee' : 'to_water';
        } else if (char.breakCooldown <= 0) {
          // Reset cooldown even if market is not quiet
          char.breakCooldown = 600 + Math.floor(Math.random() * 400);
        }
        break;

      case 'to_coffee':
      case 'to_water': {
        const dx = char.tx - char.cx;
        const dy = char.ty - char.cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < WALK_SPEED * 1.5) {
          char.cx = char.tx;
          char.cy = char.ty;
          char.state = char.state === 'to_coffee' ? 'at_coffee' : 'at_water';
          char.breakTimer = 150 + Math.floor(Math.random() * 150);
        } else {
          char.cx += (dx / dist) * WALK_SPEED;
          char.cy += (dy / dist) * WALK_SPEED;
        }
        break;
      }

      case 'at_coffee':
      case 'at_water':
        char.breakTimer--;
        if (char.breakTimer <= 0) {
          char.tx = char.deskGx;
          char.ty = char.deskGy;
          char.state = 'back';
        }
        break;

      case 'back': {
        const dx = char.tx - char.cx;
        const dy = char.ty - char.cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < WALK_SPEED * 1.5) {
          char.cx = char.deskGx;
          char.cy = char.deskGy;
          char.state = 'working';
          char.breakCooldown = 500 + i * 80 + Math.floor(Math.random() * 300);
        } else {
          char.cx += (dx / dist) * WALK_SPEED;
          char.cy += (dy / dist) * WALK_SPEED;
        }
        break;
      }
    }
  });
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  // Background
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
  bg.addColorStop(0, '#0e1222');
  bg.addColorStop(1, '#060810');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawFloor();
  drawWalls();
  drawTVScreen();

  // Depth-sorted draw list
  const items = [];

  // Plants at 4 corners
  items.push({ type:'plant',   gx:1,  gy:1,  _d: 2    });
  items.push({ type:'plant',   gx:14, gy:1,  _d: 15   });
  items.push({ type:'plant',   gx:1,  gy:8,  _d: 9    });
  items.push({ type:'plant',   gx:14, gy:8,  _d: 22   });

  // Coffee machine on right wall area
  items.push({ type:'coffee',  gx:14, gy:5,  _d: 19   });

  // Water fountain on left wall area
  items.push({ type:'water',   gx:1,  gy:5,  _d: 6    });

  // Desks
  chars.forEach(char => {
    items.push({ type:'desk', char, _d: char.deskGx + char.deskGy - 0.01 });
  });

  // Characters
  chars.forEach(char => {
    items.push({ type:'char', char, _d: char.cx + char.cy + 0.5 });
  });

  items.sort((a, b) => a._d - b._d);

  items.forEach(item => {
    switch (item.type) {
      case 'plant':  drawPlant(item.gx, item.gy);         break;
      case 'coffee': drawCoffeeMachine(item.gx, item.gy); break;
      case 'water':  drawWaterFountain(item.gx, item.gy); break;
      case 'desk':   drawDesk(item.char);                  break;
      case 'char':   drawChar(item.char);                  break;
    }
  });

  drawOverheadLights();
}

// ─── GAME LOOP ───────────────────────────────────────────────────────────────
function gameLoop() {
  t++;
  updateChars();
  render();
  requestAnimationFrame(gameLoop);
}

// ─── CLICK HANDLING ──────────────────────────────────────────────────────────
canvas.addEventListener('click', function(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width;
  const sy = H / rect.height;
  const mx = (e.clientX - rect.left) * sx;
  const my = (e.clientY - rect.top)  * sy;

  // TV screen → navigate to dashboard
  if (mx >= tvZone.x && mx <= tvZone.x + tvZone.w &&
      my >= tvZone.y && my <= tvZone.y + tvZone.h) {
    window.location.href = '/dashboard';
    return;
  }

  // Desk monitors → open agent modal
  for (const char of chars) {
    if (!char._mz) continue;
    const mz = char._mz;
    if (mx >= mz.x && mx <= mz.x + mz.w &&
        my >= mz.y && my <= mz.y + mz.h) {
      openAgentModal(char);
      return;
    }
  }
});

canvas.addEventListener('mousemove', function(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = W / rect.width;
  const sy = H / rect.height;
  const mx = (e.clientX - rect.left) * sx;
  const my = (e.clientY - rect.top)  * sy;

  let pointer = false;
  if (mx >= tvZone.x && mx <= tvZone.x + tvZone.w &&
      my >= tvZone.y && my <= tvZone.y + tvZone.h) {
    pointer = true;
  }
  if (!pointer) {
    for (const char of chars) {
      if (!char._mz) continue;
      const mz = char._mz;
      if (mx >= mz.x && mx <= mz.x + mz.w &&
          my >= mz.y && my <= mz.y + mz.h) {
        pointer = true; break;
      }
    }
  }
  canvas.style.cursor = pointer ? 'pointer' : 'default';
});

// ─── MODALS ──────────────────────────────────────────────────────────────────
function closeModals() {
  document.getElementById('agent-modal').classList.remove('open');
}

document.getElementById('agent-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModals();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModals();
});

function stateLabel(state) {
  const m = {
    working:  'Au bureau',
    to_coffee:'Vers café',
    at_coffee:'Pause café',
    to_water: 'Vers fontaine',
    at_water: 'Pause eau',
    back:     'Retour bureau'
  };
  return m[state] || state;
}

function stateBadge(state) {
  if (state === 'working')                          return ['ACTIF',      'badge-active'];
  if (state === 'at_coffee' || state === 'to_coffee') return ['PAUSE CAFÉ', 'badge-coffee'];
  if (state === 'at_water'  || state === 'to_water')  return ['PAUSE EAU',  'badge-coffee'];
  return ['EN ROUTE', 'badge-idle'];
}

function ts() {
  return new Date().toTimeString().slice(0, 8);
}

function openAgentModal(char) {
  const modal = document.getElementById('agent-modal');
  const box   = document.getElementById('agent-modal-box');

  document.getElementById('am-title').textContent = char.name.toUpperCase() + ' — DÉTAILS';
  document.getElementById('am-dot').style.background = char.shirtColor;
  document.getElementById('am-name').textContent = char.name;
  document.getElementById('am-role').textContent = char.role;

  box.style.borderTopColor = char.shirtColor;

  const [badgeText, badgeClass] = stateBadge(char.state);
  const badge = document.getElementById('am-badge');
  badge.textContent = badgeText;
  badge.className = 'agent-badge ' + badgeClass;

  const d = (apiData && apiData[char.id]) ? apiData[char.id] : {};
  const info = (d.info && Array.isArray(d.info)) ? d.info : [
    ['ÉTAT',        stateLabel(char.state)],
    ['SIGNAL',      d.signal     || '—'],
    ['TRADES',      d.trade_count || d.trades || '—'],
    ['WIN RATE',    d.win_rate   || '—'],
    ['P&L',         d.pnl        || '—'],
    ['CONFIANCE',   d.confidence !== undefined ? (d.confidence * 100).toFixed(0) + '%' : '—'],
  ];

  document.getElementById('am-info').innerHTML = info.map(([l, v]) =>
    `<div class="info-row"><div class="lbl">${l}</div><div class="val" style="color:${char.shirtColor}">${v}</div></div>`
  ).join('');

  const logs = (d.logs && Array.isArray(d.logs)) ? d.logs : [
    `[${ts()}] ${char.name} opérationnel`,
    `[${ts()}] Surveillance des marchés active`,
    `[${ts()}] En attente de signaux…`
  ];
  document.getElementById('am-terminal').innerHTML = logs.map(l =>
    `<div>${l}</div>`
  ).join('');
  const term = document.getElementById('am-terminal');
  term.scrollTop = term.scrollHeight;

  modal.classList.add('open');
}

// ─── API FETCH ───────────────────────────────────────────────────────────────
function fetchData() {
  fetch('/api/agents')
    .then(r => r.json())
    .then(data => {
      apiData = data;
      marketQuiet = !!data._market_quiet;

      if (data._stats) {
        const s = data._stats;
        const balEl = document.getElementById('hdr-balance');
        const pnlEl = document.getElementById('hdr-pnl');
        const posEl = document.getElementById('hdr-positions');
        const wrEl  = document.getElementById('hdr-winrate');
        if (balEl) balEl.textContent = s.balance  || '—';
        if (pnlEl) {
          pnlEl.textContent = s.pnl || '—';
          pnlEl.className = 'val ' + (String(s.pnl || '').startsWith('-') ? 'neg' : 'pos');
        }
        if (posEl) posEl.textContent = s.positions || '—';
        if (wrEl)  wrEl.textContent  = s.win_rate  || '—';
      }

      chars.forEach(char => {
        if (data[char.id]) char.liveData = data[char.id];
      });
    })
    .catch(() => {});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
fetchData();
setInterval(fetchData, 60000);
gameLoop();

})();
</script>
